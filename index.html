function drawAlly(a) {
  if (a.dead) return;
  const px = a.x, py = a.y, pw = a.w, ph = a.h;
  const cx = px + pw/2;

  // Engine glow (주황)
  const grd = ctx.createRadialGradient(cx, py + ph + 4, 0, cx, py + ph + 4, 14);
  grd.addColorStop(0, 'rgba(255,140,0,0.9)');
  grd.addColorStop(1, 'rgba(255,80,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.ellipse(cx, py + ph + 4 + Math.sin(state.frame*0.3)*2, 8, 14, 0, 0, Math.PI*2);
  ctx.fill();

  // Ship body (주황)
  ctx.fillStyle = '#f80';
  ctx.shadowColor = '#f80';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(cx, py);
  ctx.lineTo(px + pw*0.15, py + ph*0.85);
  ctx.lineTo(px, py + ph);
  ctx.lineTo(px + pw*0.35, py + ph*0.65);
  ctx.lineTo(cx, py + ph*0.75);
  ctx.lineTo(px + pw*0.65, py + ph*0.65);
  ctx.lineTo(px + pw, py + ph);
  ctx.lineTo(px + pw*0.85, py + ph*0.85);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.ellipse(cx, py + ph*0.35, 5, 7, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // HP bar
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(px, py - 8, pw, 4);
  ctx.fillStyle = '#f80';
  ctx.fillRect(px, py - 8, pw * (a.hp / a.maxHp), 4);
}

function fireAllyBullet(a) {
  const cx2 = a.x + a.w / 2;
  const cy2 = a.y;
  // 플레이어 gunLevel에 연동하여 아군 미사일도 함께 성장
  const allyGunLevel = Math.max(4, gunLevel); // 최소 4단계 보장
  const tier = Math.floor((allyGunLevel - 1) / 5);
  const cycle = (allyGunLevel - 1) % 5;
  const colors = ['#f80', '#ffa040', '#ffcc88'];

  // 중앙 (항상)
  allyBullets.push({ x: cx2 - 3, y: cy2, w: 6, h: 14, vx: 0, vy: -13, color: colors[0] });
  // cycle 1+: 좌우
  if (cycle >= 1) {
    allyBullets.push({ x: cx2 - 16, y: cy2 + 4, w: 5, h: 12, vx: 0, vy: -13, color: colors[1] });
    allyBullets.push({ x: cx2 + 10, y: cy2 + 4, w: 5, h: 12, vx: 0, vy: -13, color: colors[1] });
  }
  // cycle 3+: 바깥 좌우
  if (cycle >= 3) {
    allyBullets.push({ x: cx2 - 29, y: cy2 + 8, w: 4, h: 10, vx: 0, vy: -13, color: colors[2] });
    allyBullets.push({ x: cx2 + 23, y: cy2 + 8, w: 4, h: 10, vx: 0, vy: -13, color: colors[2] });
  }
}

function updateAllies() {
  for (let a of allies) {
    if (a.dead) continue;

    // 자유 이동 - 적과 적 미사일을 피하는 AI
    a.moveTimer++;

    // 위험 감지: 근처 적 또는 적 미사일
    let dangerDx = 0, dangerDy = 0;
    let inDanger = false;
    const AVOID_DIST = 80;
    const BULLET_AVOID_DIST = 60;

    // 적 몸통 회피
    for (let e of enemies) {
      const ex = e.x + e.w/2, ey = e.y + e.h/2;
      const ax2 = a.x + a.w/2, ay2 = a.y + a.h/2;
      const dist = Math.hypot(ex - ax2, ey - ay2);
      if (dist < AVOID_DIST && dist > 0) {
        dangerDx -= (ex - ax2) / dist * (AVOID_DIST - dist);
        dangerDy -= (ey - ay2) / dist * (AVOID_DIST - dist);
        inDanger = true;
      }
    }

    // 적 미사일 회피
    for (let b of enemyBullets) {
      const bx = b.x + b.w/2, by = b.y + b.h/2;
      const ax2 = a.x + a.w/2, ay2 = a.y + a.h/2;
      const dist = Math.hypot(bx - ax2, by - ay2);
      if (dist < BULLET_AVOID_DIST && dist > 0) {
        dangerDx -= (bx - ax2) / dist * (BULLET_AVOID_DIST - dist) * 1.5;
        dangerDy -= (by - ay2) / dist * (BULLET_AVOID_DIST - dist) * 1.5;
        inDanger = true;
      }
    }

    if (inDanger) {
      // 위험 회피 우선
      const dLen = Math.hypot(dangerDx, dangerDy) || 1;
      a.moveX = (dangerDx / dLen) * 4;
      a.moveY = (dangerDy / dLen) * 4;
    } else if (a.moveTimer > 80 || a.x <= 10 || a.x >= canvas.width - a.w - 10) {
      a.moveTimer = 0;
      a.moveX = (Math.random() - 0.5) * 3.5;
      // Y축은 화면 하단 절반에서만 이동
      const targetY = canvas.height * 0.5 + Math.random() * (canvas.height * 0.4);
      a.moveY = (targetY - a.y) * 0.03;
    }
    a.x += a.moveX;
    a.y += a.moveY;

    // 화면 하단 절반에만 고정
    a.x = Math.max(0, Math.min(canvas.width - a.w, a.x));
    a.y = Math.max(canvas.height * 0.5, Math.min(canvas.height - a.h - 60, a.y));

    // 자동 발사
    a.fireTimer++;
    if (a.fireTimer >= 30) {
      a.fireTimer = 0;
      fireAllyBullet(a);
    }

    // 적 피격 (적 총알에 맞으면 데미지)
    for (let b of enemyBullets) {
      if (b.x < a.x+a.w && b.x+b.w > a.x && b.y < a.y+a.h && b.y+b.h > a.y) {
        a.hp -= b.dmg || 10;
        b.dead = true;
        spawnParticles(a.x+a.w/2, a.y+a.h/2, '#f80', 6);
      }
    }
    // 적 몸통 충돌
    for (let e of enemies) {
      if (e.x < a.x+a.w && e.x+e.w > a.x && e.y < a.y+a.h && e.y+e.h > a.y) {
        a.hp -= 8;
        spawnParticles(a.x+a.w/2, a.y+a.h/2, '#f80', 8);
      }
    }

    if (a.hp <= 0) {
      spawnParticles(a.x+a.w/2, a.y+a.h/2, '#f80', 30);
      a.dead = true;
      // 격추 메시지 표시
      const el = document.getElementById('levelUpMsg');
      const subEl = document.getElementById('luSubText');
      subEl.textContent = '💥 아군 비행기 격추당함';
      subEl.style.color = '#f44';
      subEl.style.textShadow = '0 0 20px #f44, 0 0 40px #f00';
      el.classList.add('show');
      setTimeout(() => {
        el.classList.remove('show');
        subEl.style.color = '#fc0';
        subEl.style.textShadow = '0 0 20px #fc0, 0 0 40px #f80';
      }, 2000);
    }
  }
  allies = allies.filter(a => !a.dead);

  // 아군 미사일 이동 및 적 충돌
  for (let b of allyBullets) {
    b.x += b.vx; b.y += b.vy;
    for (let e of enemies) {
      if (b.x < e.x+e.w && b.x+b.w > e.x && b.y < e.y+e.h && b.y+b.h > e.y) {
        e.hp--;
        spawnParticles(b.x, b.y, '#f80', 4);
        b.dead = true;
      }
    }
  }
  allyBullets = allyBullets.filter(b => !b.dead && b.y > -50 && b.y < canvas.height + 50 && b.x > -50 && b.x < canvas.width + 50);
}

function drawAllyBullets() {
  for (let b of allyBullets) {
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#f80';
    ctx.fillStyle = '#f80';
    ctx.beginPath();
    ctx.rect(b.x, b.y, b.w, b.h);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function showGunLevelMsg() {
  const el = document.getElementById('levelUpMsg');
  const tier = Math.floor((gunLevel - 1) / 5) + 1;
  const cycle = (gunLevel - 1) % 5 + 1;
  const tierNames = ['', '🔵', '🟠', '🟣', '🔴', '🟢'];
  const tierIcon = tierNames[Math.floor((gunLevel-1)/5) % tierNames.length] || '⭐';
  document.getElementById('luSubText').textContent = `⚡ 미사일 ${gunLevel}단 강화 ${tierIcon}`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

// ─── ENEMY SPAWN RATE ───
function getSpawnInterval() {
  // 레벨 1: 70프레임마다, 레벨 10: 12프레임마다 (매우 빠름)
  // 레벨 8은 간격을 2배로 늘려 출현 수를 절반으로
  // 레벨 21: ghost 스폰 간격 3배 (전체 스폰 수 약 30%로 줄임)
  if (state.level >= 21) return 36; // ghost 전용 간격
  const base = Math.max(12, 70 - state.level * 6);
  return state.level === 8 ? base * 2 : base;
}



// ─── UPDATE HP UI ───
function updateHP() {
  document.getElementById('hpFill').style.width = Math.max(0, state.hp / state.maxHp * 100) + '%';
  document.getElementById('scoreDisplay').textContent = state.score;
  // 미사일 파워 레벨 표시
  const glEl = document.getElementById('gunLevelDisplay');
  if (glEl) {
    const tierNames = ['⭐','💫','🌟','✨','🔥'];
    const tier = gunLevel > 0 ? Math.floor((gunLevel - 1) / 5) : 0;
    const icon = tierNames[tier % tierNames.length] || '⭐';
    glEl.textContent = `⚡ PWR Lv.${gunLevel} ${icon}`;
  }
}

// ─── PLAYER MOVEMENT ───
function movePlayer() {
  let dx = 0, dy = 0;
  const spd = player.speed;

  if (keys.left)  dx -= spd;
  if (keys.right) dx += spd;
  if (keys.up)    dy -= spd;
  if (keys.down)  dy += spd;

  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x + dx));
  player.y = Math.max(0, Math.min(canvas.height - player.h - 110, player.y + dy));

  // Trail
  player.trail.unshift({ x: player.x, y: player.y });
  if (player.trail.length > 8) player.trail.pop();

  if (player.invincible > 0) player.invincible--;
}

// ─── PAUSE ───
let paused = false;
function togglePause() {
  if (!state.running) return;
  paused = !paused;
  const overlay = document.getElementById('pauseOverlay');
  const btn = document.getElementById('pauseBtn').querySelector('.score-label');
  if (paused) {
    overlay.style.display = 'flex';
    btn.textContent = '▶ 계속하기';
  } else {
    overlay.style.display = 'none';
    btn.textContent = '⏸ 잠시멈춤';
    requestAnimationFrame(gameLoop);
  }
}

// ─── METEOR FUNCTIONS ───
function spawnMeteor() {
  // 오른쪽 위에서 왼쪽 아래로 60도 각도
  // 시작점: 화면 상단 또는 오른쪽 경계
  let startX, startY;
  if (Math.random() < 0.6) {
    // 상단에서 시작 (오른쪽 위쪽)
    startX = canvas.width * 0.3 + Math.random() * canvas.width * 0.9;
    startY = -20;
  } else {
    // 오른쪽에서 시작
    startX = canvas.width + Math.random() * 60;
    startY = -20 + Math.random() * canvas.height * 0.3;
  }
  const size = 8 + Math.random() * 16;
  meteors.push({
    x: startX,
    y: startY,
    r: size,
    vx: METEOR_VX,
    vy: METEOR_VY,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.12,
    dead: false,
  });
}

function updateMeteors() {
  // 레벨20 이상이면 대각선 운석 중단
  if (state.level < 16 || state.level >= 20) { meteors = []; meteorStormActive = false; meteorStormTimer = 0; return; }

  // 운석 폭풍 사이클: 5초 ON → 5초 OFF → 반복
  meteorStormTimer++;
  const cycleLen = METEOR_STORM_ON + METEOR_STORM_OFF;
  const phase = meteorStormTimer % cycleLen;
  meteorStormActive = (phase < METEOR_STORM_ON);

  // 운석 스폰
  if (meteorStormActive) {
    meteorSpawnTimer++;
    if (meteorSpawnTimer >= 4) { // 4프레임마다 1~2개
      meteorSpawnTimer = 0;
      spawnMeteor();
      if (Math.random() < 0.55) spawnMeteor();
    }
  }

  // 운석 이동 및 충돌
  for (const m of meteors) {
    if (m.dead) continue;
    m.x += m.vx;
    m.y += m.vy;
    m.rotation += m.rotSpeed;

    // 플레이어와 충돌
    const px = player.x + player.w/2, py2 = player.y + player.h/2;
    const dist = Math.hypot(m.x - px, m.y - py2);
    if (dist < m.r + 14 && player.invincible <= 0) {
      state.hp -= 18;
      player.invincible = 90;
      spawnParticles(m.x, m.y, '#f84', 20);
      m.dead = true;
      continue;
    }

    // 적과 충돌
    for (const e of enemies) {
      const ex = e.x + e.w/2, ey = e.y + e.h/2;
      if (Math.hypot(m.x - ex, m.y - ey) < m.r + e.w/2) {
        e.hp -= 999; // 적 즉시 파괴
        spawnParticles(ex, ey, '#f84', 15);
        m.dead = true;
        break;
      }
    }

    // 화면 밖으로 나가면 제거
    if (m.x < -80 || m.y > canvas.height + 80) m.dead = true;
  }
  meteors = meteors.filter(m => !m.dead);
}

function drawMeteors() {
  for (const m of meteors) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rotation);

    // 꼬리 (트레일)
    const trailLen = 30;
    const trailGrd = ctx.createLinearGradient(0, 0, -m.vx * trailLen/6, -m.vy * trailLen/6);
    trailGrd.addColorStop(0, 'rgba(255,140,40,0.7)');
    trailGrd.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = trailGrd;
    ctx.beginPath();
    ctx.ellipse(-m.vx * trailLen/12, -m.vy * trailLen/12, m.r * 0.5, trailLen, Math.atan2(m.vy, m.vx), 0, Math.PI * 2);
    ctx.fill();

    // 돌 몸체
    ctx.shadowColor = '#ff6622';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.arc(0, 0, m.r, 0, Math.PI * 2);
    ctx.fill();

    // 표면 크레이터 느낌
    ctx.fillStyle = '#5a2d0c';
    ctx.beginPath();
    ctx.arc(-m.r * 0.25, -m.r * 0.2, m.r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a0522d';
    ctx.beginPath();
    ctx.arc(m.r * 0.2, m.r * 0.15, m.r * 0.22, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// ─── VERTICAL METEOR RAIN (레벨20) ───
let vMeteorGapX = -1;
let level21EntryFrame = -1; // 레벨21 진입 프레임 기록
let level21EntryScore = 0;  // 레벨21 진입 시점 점수 기록
let vMeteorGapWidth = 0;
let vMeteorGapChangeTimer = 0;

function initVMeteorGap() {
  vMeteorGapWidth = 100 + Math.random() * 40; // 통로 너비 100~140px
  vMeteorGapX = vMeteorGapWidth / 2 + Math.random() * (canvas.width - vMeteorGapWidth);
}

function spawnVMeteorRow() {
  if (vMeteorGapX < 0) initVMeteorGap();

  // 안전하게 최대 개수 제한
  if (vMeteors.length > 120) return;

  const size = 12 + Math.random() * 8;
  const spacing = 70; // 고정 간격 (while 루프 안전하게)
  const gapL = vMeteorGapX - vMeteorGapWidth / 2;
  const gapR = vMeteorGapX + vMeteorGapWidth / 2;

  for (let x = size; x < canvas.width - size; x += spacing) {
    // 통로 구간 스킵
    if (x + size > gapL && x - size < gapR) continue;
    vMeteors.push({
      x: x + (Math.random() - 0.5) * 14,
      y: -size - Math.random() * 30,
      r: size,
      vy: 6.0 + Math.random() * 4.0,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.09,
      dead: false,
    });
  }
}

function updateVMeteors() {
  if (state.level < 20 || state.level >= 21) {
    vMeteors = [];
    vMeteorRainActive = false;
    vMeteorRainTimer = 0;
    vMeteorGapX = -1;
    return;
  }

  // 최초 진입 알림
  if (!vMeteorRainAnnounced) {
    vMeteorRainAnnounced = true;
    enemies = []; enemyBullets = [];
    initVMeteorGap();
    const el = document.getElementById('levelUpMsg');
    const sub = document.getElementById('luSubText');
    sub.textContent = '☄ 수직 운석 폭우! 적군 소멸! ☄';
    sub.style.color = '#ff6600';
    sub.style.textShadow = '0 0 20px #ff6600, 0 0 40px #ff3300';
    el.classList.add('show');
    setTimeout(() => {
      el.classList.remove('show');
      sub.style.color = '#fc0';
      sub.style.textShadow = '0 0 20px #fc0, 0 0 40px #f80';
    }, 3000);
  }

  // 20초 ON → 3초 OFF → 20초 ON → 레벨21 전환 (총 2580프레임)
  const V_TOTAL = V_METEOR_ON + V_METEOR_OFF + V_METEOR_ON;
  vMeteorRainTimer++;

  if (vMeteorRainTimer >= V_TOTAL) {
    // 2회 완료 → 즉시 레벨21로 전환
    vMeteors = [];
    vMeteorRainActive = false;
    if (state.level === 20) {
      state.level = 21;
      level21EntryFrame = state.frame; // 진입 시각 기록
      level21EntryScore = state.score;  // 진입 점수 기록
      document.getElementById('levelDisplay').textContent = '21';
      const el2 = document.getElementById('levelUpMsg');
      const sub2 = document.getElementById('luSubText');
      sub2.style.color = '#00ffee';
      sub2.style.textShadow = '0 0 24px #00ffcc, 0 0 50px #00aacc';
      sub2.textContent = '\uD83D\uDC7B 고스트 편대 출현! 투명 경보!';
      el2.classList.add('show');
      setTimeout(() => {
        el2.classList.remove('show');
        sub2.style.color = '#fc0';
        sub2.style.textShadow = '0 0 20px #fc0, 0 0 40px #f80';
      }, 3000);
    }
    return;
  }

  const t = vMeteorRainTimer;
  if (t < V_METEOR_ON) {
    vMeteorRainActive = true; // 1차 ON (0~1199)
  } else if (t < V_METEOR_ON + V_METEOR_OFF) {
    vMeteorRainActive = false; // OFF 휴식 (1200~1379)
  } else {
    vMeteorRainActive = true; // 2차 ON (1380~2579)
  }

  if (vMeteorRainActive) {
    // 통로 위치 3초마다 변경
    vMeteorGapChangeTimer++;
    if (vMeteorGapChangeTimer >= 180) {
      vMeteorGapChangeTimer = 0;
      initVMeteorGap();
    }

    vMeteorSpawnTimer++;
    if (vMeteorSpawnTimer >= 15) {
      vMeteorSpawnTimer = 0;
      spawnVMeteorRow();
    }
  } else {
    vMeteorSpawnTimer = 14;
  }

  // 이동 & 충돌
  const px = player.x + player.w / 2;
  const py2 = player.y + player.h / 2;
  for (const m of vMeteors) {
    if (m.dead) continue;
    m.y += m.vy;
    m.rotation += m.rotSpeed;

    // 플레이어 충돌
    if (player.invincible <= 0 && Math.hypot(m.x - px, m.y - py2) < m.r + 14) {
      state.hp -= 20;
      player.invincible = 90;
      spawnParticles(m.x, m.y, '#ff6600', 12);
      m.dead = true;
      continue;
    }

    if (m.y > canvas.height + 60) m.dead = true;
  }
  vMeteors = vMeteors.filter(m => !m.dead);
}

function drawVMeteors() {
  // 통로 가이드라인
  if (vMeteorRainActive && vMeteorGapX > 0) {
    const gapL = vMeteorGapX - vMeteorGapWidth / 2;
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#64dcff';
    ctx.fillRect(gapL, 0, vMeteorGapWidth, canvas.height);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // 운석 일괄 드로우 (gradient 제거 → 단순 원으로 성능 확보)
  for (const m of vMeteors) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rotation);

    // 꼬리 (단순 사각형으로 대체)
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ff8833';
    ctx.fillRect(-m.r * 0.3, -m.r * 3.5, m.r * 0.6, m.r * 3);
    ctx.globalAlpha = 1;

    // 돌 몸체
    ctx.shadowColor = '#ff6622';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#7a3a10';
    ctx.beginPath();
    ctx.arc(0, 0, m.r, 0, Math.PI * 2);
    ctx.fill();

    // 크레이터
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#4a1e08';
    ctx.beginPath();
    ctx.arc(-m.r * 0.28, -m.r * 0.22, m.r * 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
  ctx.shadowBlur = 0;
}

// ─── MAIN LOOP ───
let spawnTimer = 0;
function gameLoop() {
  if (!state.running || paused) return;
  state.frame++;
  spawnTimer++;

  // 거리 계속 증가 (레벨이 높을수록 더 빠르게)
  state.distance += 0.5 + state.level * 0.15;
  if (state.distance > bestDistance) bestDistance = state.distance;
  const distM = Math.floor(state.distance);
  const bestM = Math.floor(bestDistance);
  const distEl = document.getElementById('distDisplay');
  const bestEl = document.getElementById('bestDistDisplay');
  if (distEl) distEl.textContent = distM >= 1000 ? (distM/1000).toFixed(1)+'km' : distM+'m';
  if (bestEl) bestEl.textContent = 'BEST ' + (bestM >= 1000 ? (bestM/1000).toFixed(1)+'km' : bestM+'m');

  ctx.fillStyle = '#000010';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle nebula
  const nebulaGrd = ctx.createRadialGradient(canvas.width*0.3, canvas.height*0.4, 0, canvas.width*0.3, canvas.height*0.4, canvas.width*0.6);
  nebulaGrd.addColorStop(0, 'rgba(30,0,60,0.3)');
  nebulaGrd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = nebulaGrd;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  updateStars(); drawStars();
  updateAndDrawLightnings();
  movePlayer();

  // Auto fire always active
  fireTimer++;
  const fireRate = Math.max(6, 10 - Math.floor(state.level / 2));
  if (fireTimer % fireRate === 0) fireBullet();

  if (spawnTimer >= getSpawnInterval()) {
    spawnTimer = 0;
    // 레벨20: 적군 스폰 없음 (수직 운석 구간)
    // 레벨21+: ghost 적 스폰
    // 메가보스 전투 중엔 일반 적 스폰 없음
    if (!megaBossActive && !pinkBossActive && state.level !== 20) {
      if (state.level === 21) {
        // 레벨21: 3초(180프레임) 딜레이 후 ghost 1기씩만 스폰
        if (level21EntryFrame >= 0 && state.frame - level21EntryFrame > 180) {
          spawnEnemy(); // ghost만 나옴 (spawnEnemy 내부에서 lv>=21이면 ghost 강제)
        }
      } else if (state.level >= 22) {
        // 레벨22: pinkBoss 전투 중 — 적 스폰 없음
      } else {
        // 레벨 7: 1/2 확률로 스폰 스킵 (전보다 조금 더 어렵게)
        if (state.level === 7 && Math.random() > 0.5) { /* 스폰 스킵 */ }
        else {
          spawnEnemy();
          // 레벨7: 추가스폰 1개만 낮은 확률로 허용
          if (state.level === 7 && Math.random() < 0.25) { spawnEnemyFiltered(); }
          // 레벨 올라갈수록 동시 스폰 증가
          if (state.level >= 3 && state.level !== 7 && Math.random() < 0.3 + state.level * 0.05) { spawnEnemyFiltered(); }
          if (state.level >= 5 && state.level !== 7 && Math.random() < 0.3 + state.level * 0.04) { spawnEnemyFiltered(); }
          if (state.level >= 8 && Math.random() < 0.2) { spawnEnemyFiltered(); }  // 레벨8: 0.4→0.2
          if (state.level >= 9 && Math.random() < 0.4) { spawnEnemyFiltered(); }
        }
      }
    }
  }

  updateBullets();
  updateEnemies();
  updateAllies();
  updatePatriots();
  updateLaser();
  updateMegaBoss();
  updatePinkBoss();
  updateMeteors();
  updateVMeteors();
  updatePowerups();
  updateParticles();

  drawParticles();
  drawBullets();
  drawAllyBullets();
  drawPatriots();
  drawLaser();
  drawMeteors();
  drawVMeteors();
  for (let e of enemies) drawEnemy(e);
  if (megaBoss) drawMegaBoss();
  if (pinkBoss) drawPinkBoss();
  for (let a of allies) drawAlly(a);
  drawPowerups();
  drawPlayer();

  // 운석 폭풍 경고 표시 (레벨16~19)
  if (state.level >= 16 && state.level < 20 && meteorStormActive) {
    const cycleLen = METEOR_STORM_ON + METEOR_STORM_OFF;
    const phase = meteorStormTimer % cycleLen;
    const remaining = METEOR_STORM_ON - phase;
    if (remaining <= 60) {
      const blink = Math.floor(state.frame / 6) % 2 === 0;
      if (blink) {
        ctx.save();
        ctx.font = 'bold 16px Orbitron, monospace';
        ctx.fillStyle = '#ff4400';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff4400';
        ctx.shadowBlur = 12;
        ctx.fillText('☄ 운석 폭풍 종료 중 ☄', canvas.width/2, canvas.height/2 + 60);
        ctx.restore();
      }
    } else {
      ctx.save();
      ctx.font = 'bold 14px Orbitron, monospace';
      ctx.fillStyle = 'rgba(255,80,0,0.8)';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = 8;
      ctx.fillText('☄ 운석 폭풍 ☄', canvas.width/2, canvas.height - 120);
      ctx.restore();
    }
  }

  // 레벨20 수직 운석 HUD (2회 고정 구조에 맞게 계산)
  if (state.level === 20) {
    const t20 = vMeteorRainTimer;
    ctx.save();
    ctx.textAlign = 'center';
    if (vMeteorRainActive) {
      // 현재 ON 구간 남은 시간 계산
      let remaining20;
      if (t20 < V_METEOR_ON) {
        remaining20 = V_METEOR_ON - t20; // 1차 ON 남은 시간
      } else {
        remaining20 = (V_METEOR_ON + V_METEOR_OFF + V_METEOR_ON) - t20; // 2차 ON 남은 시간
      }
      ctx.fillStyle = 'rgba(255,60,0,0.15)';
      ctx.fillRect(0, canvas.height - 130, canvas.width, 30);
      ctx.font = 'bold 13px Orbitron, monospace';
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = 10;
      if (remaining20 <= 60 && Math.floor(state.frame / 5) % 2 === 0) {
        ctx.fillStyle = '#ff2200';
        ctx.fillText('☄ 수직 운석 폭우 ☄  곧 종료!', canvas.width/2, canvas.height - 115);
      } else {
        ctx.fillStyle = 'rgba(255,130,50,0.9)';
        ctx.fillText(`☄ 수직 운석 폭우 ☄  ${Math.ceil(remaining20/60)}초`, canvas.width/2, canvas.height - 115);
      }
    } else {
      // 휴식 구간 카운트다운 (1차 OFF만 존재)
      const nextIn = (V_METEOR_ON + V_METEOR_OFF) - t20;
      ctx.fillStyle = 'rgba(100,200,255,0.15)';
      ctx.fillRect(0, canvas.height - 130, canvas.width, 30);
      ctx.font = 'bold 13px Orbitron, monospace';
      ctx.fillStyle = 'rgba(100,200,255,0.85)';
      ctx.shadowColor = '#00aaff';
      ctx.shadowBlur = 8;
      ctx.fillText(`☄ 2차 폭우 재개 ${Math.ceil(nextIn/60)}초 후 ☄`, canvas.width/2, canvas.height - 115);
    }
    ctx.restore();
  }

  checkLevel();
  updateHP();
  document.getElementById('fireBombBtn').disabled = bombCount <= 0;

  if (state.hp <= 0) {
    state.running = false;
    showGameOver();
    return;
  }

  requestAnimationFrame(gameLoop);
}

// ─── GAME OVER / START ───
function showGameOver() {
  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  const distM = Math.floor(state.distance);
  const bestM = Math.floor(bestDistance);
  const fmtDist = d => d >= 1000 ? (d/1000).toFixed(1)+'km' : d+'m';
  const isBest = distM >= bestM;
  overlay.innerHTML = `
    <div class="overlay-title" style="font-size:28px">GAME OVER</div>
    <div class="overlay-sub">UNIVERSE FALLEN</div>
    <div class="final-score">SCORE: <span>${state.score}</span></div>
    <div class="final-score">LEVEL: <span>${state.level}</span></div>
    <div class="final-score">거리: <span style="color:#0ff">${fmtDist(distM)}</span>${isBest ? ' <span style="color:#f80;font-size:12px">🏆 NEW BEST!</span>' : ''}</div>
    <div class="final-score" style="font-size:13px">최고기록: <span style="color:#f80">${fmtDist(bestM)}</span></div>
    <button class="start-btn" id="startBtn" style="margin-top:20px">🏠 첫 화면으로 이동</button>
  `;
  document.getElementById('startBtn').addEventListener('click', goToTitle);
}

function goToTitle() {
  // 모든 게임 상태 초기화 후 타이틀 화면 표시
  state.running = false;
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `
    <div class="overlay-title">GALAXY<br>STORM</div>
    <div class="overlay-sub">DEFEND THE UNIVERSE</div>
    <button class="start-btn" id="startBtn">▶ START GAME</button>
    <div class="how-to">🕹️ 조이스틱으로 이동 | 자동 발사</div>
    <div id="levelJump">
      <div class="lj-label">⚡ LEVEL JUMP ⚡</div>
      <div class="lj-grid">
        <button class="lj-btn" onclick="jumpToSet(1)">1세트</button>
        <button class="lj-btn" onclick="jumpToSet(4)">4세트</button>
        <button class="lj-btn" onclick="jumpToSet(7)">7세트</button>
        <button class="lj-btn" onclick="jumpToSet(10)">10세트</button>
        <button class="lj-btn" onclick="jumpToSet(13)">13세트</button>
        <button class="lj-btn" onclick="jumpToSet(16)">16세트</button>
        <button class="lj-btn" onclick="jumpToSet(19)">19세트</button>
        <button class="lj-btn" onclick="jumpToSet(20)">20세트</button>
        <button class="lj-btn" onclick="jumpToSet(21)">21세트</button>
        <button class="lj-btn" onclick="jumpToSet(22)">22세트</button>
      </div>
    </div>
  `;
  overlay.style.display = 'flex';
  document.getElementById('startBtn').addEventListener('click', startGame);
  requestAnimationFrame(idleLoop);
}

function startGame() {
  paused = false;
  document.getElementById('pauseOverlay').style.display = 'none';
  const pauseLabel = document.getElementById('pauseBtn');
  if (pauseLabel) pauseLabel.querySelector('.score-label').textContent = '⏸ 잠시멈춤';
  state = { running: true, score: 0, level: 1, hp: 100, maxHp: 100, frame: 0, gameOver: false, distance: 0 };
  player = { x: canvas.width/2 - 18, y: canvas.height - 200, w: 36, h: 36, speed: 4.5, invincible: 0, trail: [] };
  gunLevel = 0;
  bullets = []; enemyBullets = []; enemies = []; allies = []; allyBullets = []; patriots = []; straightPatriots = []; powerups = []; particles = [];
  spawnTimer = 0;
  fireTimer = 0;
  allySpawned = false;
  bombLevel8Spawned = false;
  bombCount = 2;
  lightnings = [];
  patriotTimer = 0;
  straightPatriotTimer = 0;
  laserState = 'off';
  laserTimer = 0;
  megaBoss = null;
  megaBossActive = false;
  megaBossDefeated = false;
  megaBossLaserState = 'off';
  megaBossLaserTimer = 0;
  pinkBoss = null;
  pinkBossActive = false;
  pinkBossDefeated = false;
  pinkBossCountdown = -1;
  pinkBossCountdownTimer = 0;
  pinkBossReinforced = false;
  meteors = [];
  meteorStormActive = false;
  meteorStormTimer = 0;
  meteorSpawnTimer = 0;
  vMeteors = [];
  vMeteorRainActive = false;
  vMeteorRainTimer = 0;
  vMeteorSpawnTimer = 0;
  vMeteorRainAnnounced = false;
  vMeteorGapX = -1;
  vMeteorGapChangeTimer = 0;
  level21EntryFrame = -1;
  updateBombUI();
  initStars();
  document.getElementById('levelDisplay').textContent = '01';
  document.getElementById('overlay').style.display = 'none';
  requestAnimationFrame(gameLoop);
}

// ─── LEVEL JUMP ───
function jumpToSet(setNum) {
  // 세트 번호로 게임 시작, 미사일 레벨 = 세트번호 - 1
  paused = false;
  document.getElementById('pauseOverlay').style.display = 'none';
  const pauseLabel = document.getElementById('pauseBtn');
  if (pauseLabel) pauseLabel.querySelector('.score-label').textContent = '⏸ 잠시멈춤';

  // 세트 번호를 레벨로 변환 (1세트=레벨1, 4세트=레벨4, ...)
  const targetLevel = setNum;
  // 해당 레벨에 맞는 스코어 계산 (레벨 임계값 기준)
  const thresholds = [0,300,750,1500,2700,4500,7500,10000,18000,27000];
  let startScore = 0;
  if (targetLevel <= 10) {
    startScore = thresholds[Math.min(targetLevel - 1, thresholds.length - 1)] || 0;
  } else {
    startScore = 27000 + (targetLevel - 10) * 15000;
  }

  state = { running: true, score: startScore, level: targetLevel, hp: 100, maxHp: 100, frame: 0, gameOver: false, distance: 0 };
  player = { x: canvas.width/2 - 18, y: canvas.height - 200, w: 36, h: 36, speed: 4.5, invincible: 0, trail: [] };

  // 미사일 레벨 = 세트번호 - 1
  gunLevel = Math.max(0, setNum - 1);

  bullets = []; enemyBullets = []; enemies = []; allies = []; allyBullets = []; patriots = []; straightPatriots = []; powerups = []; particles = [];
  spawnTimer = 0;
  fireTimer = 0;
  allySpawned = false;
  bombLevel8Spawned = false;
  bombCount = setNum >= 8 ? 3 : 2;
  lightnings = [];
  patriotTimer = 0;
  straightPatriotTimer = 0;
  laserState = 'off';
  laserTimer = 0;
  megaBoss = null;
  megaBossActive = false;
  megaBossDefeated = setNum > 15; // 16세트 이상이면 메가보스 이미 격파 처리
  megaBossLaserState = 'off';
  megaBossLaserTimer = 0;
  meteors = [];
  meteorStormActive = false;
  meteorStormTimer = 0;
  meteorSpawnTimer = 0;
  vMeteors = [];
  vMeteorRainActive = false;
  vMeteorRainTimer = 0;
  vMeteorSpawnTimer = 0;
  vMeteorRainAnnounced = (setNum < 20); // 20세트 진입이면 알림 다시 보여줌
  vMeteorGapX = -1;
  vMeteorGapChangeTimer = 0;
  level21EntryFrame = (setNum >= 21) ? 0 : -1;
  level21EntryScore = (setNum === 21) ? state.score : 0;
  pinkBoss = null;
  pinkBossActive = false;
  pinkBossDefeated = setNum > 22; // 23세트 이상이면 이미 격파 처리
  pinkBossCountdown = -1;
  pinkBossCountdownTimer = 0;
  pinkBossReinforced = false;

  // 22세트 점프 시 핑크보스 즉시 스폰
  if (setNum === 22) {
    setTimeout(() => spawnPinkBoss(), 1200);
  }

  // 레벨에 따른 아군 설정
  if (setNum >= 7) { allySpawned = true; spawnAlly(); }
  if (setNum >= 9) { spawnAlly(); spawnAlly(); }
  if (setNum >= 8) { bombLevel8Spawned = true; }

  updateBombUI();
  initStars();
  document.getElementById('levelDisplay').textContent = String(targetLevel).padStart(2,'0');
  document.getElementById('overlay').style.display = 'none';

  // 레벨 점프 알림 메시지
  const el = document.getElementById('levelUpMsg');
  const sub = document.getElementById('luSubText');
  sub.textContent = `🚀 ${setNum}세트 진입! 미사일 Lv.${gunLevel}`;
  sub.style.color = '#0af';
  sub.style.textShadow = '0 0 20px #0af';
  el.classList.add('show');
  setTimeout(() => {
    el.classList.remove('show');
    sub.style.color = '#fc0';
    sub.style.textShadow = '0 0 20px #fc0, 0 0 40px #f80';
  }, 2500);

  requestAnimationFrame(gameLoop);
}

// ─── CONTROLS ───
function setupControls() {
  // ── KEYBOARD ──
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
    if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
    if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
  });
}

// ─── DIRECT TOUCH CONTROL (상대적 이동 방식) ───
const touchOverlay = document.getElementById('touchOverlay');
let touchActive = false;
let lastTouchPos = null; // 이전 손가락 위치 저장

function getTouchPos(touch) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (touch.clientX - rect.left) * scaleX,
    y: (touch.clientY - rect.top) * scaleY
  };
}

touchOverlay.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!state || !state.running) return;
  touchActive = true;
  // 손가락을 처음 대는 위치를 기억만 하고, 비행기는 현재 위치 그대로 유지
  lastTouchPos = getTouchPos(e.touches[0]);
}, { passive: false });

touchOverlay.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchActive || !state || !state.running || !lastTouchPos) return;
  const pos = getTouchPos(e.touches[0]);
  // 손가락 이동량만큼 비행기를 이동
  const dx = pos.x - lastTouchPos.x;
  const dy = pos.y - lastTouchPos.y;
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x + dx));
  player.y = Math.max(0, Math.min(canvas.height - player.h - 60, player.y + dy));
  lastTouchPos = pos;
}, { passive: false });

touchOverlay.addEventListener('touchend', e => {
  e.preventDefault();
  touchActive = false;
  lastTouchPos = null;
}, { passive: false });

touchOverlay.addEventListener('touchcancel', e => {
  touchActive = false;
  lastTouchPos = null;
}, { passive: false });

// ─── INIT ───
setupControls();
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('fireBombBtn').addEventListener('click', useBomb);
document.getElementById('resumeBtn').addEventListener('click', togglePause);
initStars();

// Draw idle stars
function idleLoop() {
  if (state.running) return;
  ctx.fillStyle = '#000010';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  state.frame++;
  updateStars();
  drawStars();
  requestAnimationFrame(idleLoop);
}
idleLoop();
</script>
