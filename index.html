<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚀 GALAXY STORM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }

  body {
    background: #000;
    overflow: hidden;
    font-family: 'Orbitron', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100dvh;
    width: 100vw;
  }

  #gameWrapper {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }

  .ui-box {
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(0,200,255,0.3);
    border-radius: 8px;
    padding: 6px 12px;
    backdrop-filter: blur(4px);
  }

  .score-label { font-size: 9px; color: #0af; letter-spacing: 2px; }
  .score-val { font-size: 20px; color: #fff; font-weight: 900; line-height: 1; }
  .level-val { font-size: 14px; color: #f0a; font-weight: 700; }

  #healthBar {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    z-index: 10;
    pointer-events: none;
  }

  .hp-label { font-size: 9px; color: #0f8; letter-spacing: 2px; margin-bottom: 4px; }
  .hp-track {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    border: 1px solid rgba(0,255,136,0.3);
    overflow: hidden;
  }
  .hp-fill {
    height: 100%;
    background: linear-gradient(90deg, #0f8, #0f4);
    border-radius: 4px;
    transition: width 0.2s;
    box-shadow: 0 0 8px #0f8;
  }


  /* controls 영역 없음 - 직접 터치 방식 */

  #overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,10,0.92);
    backdrop-filter: blur(8px);
  }

  .overlay-title {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #0af, #f0a, #fc0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    text-align: center;
  }
  .overlay-sub {
    font-size: 11px;
    color: #0af;
    letter-spacing: 3px;
    margin-bottom: 32px;
    font-family: 'Rajdhani', sans-serif;
  }

  .start-btn {
    background: linear-gradient(135deg, #0af, #06f);
    border: none;
    border-radius: 40px;
    padding: 14px 48px;
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(0,170,255,0.5);
    margin-bottom: 12px;
    transition: transform 0.1s;
  }
  .start-btn:active { transform: scale(0.96); }

  .how-to {
    font-size: 9px;
    color: #446;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.8;
    font-family: 'Rajdhani', sans-serif;
    margin-top: 20px;
  }

  /* 레벨 바로가기 */
  #levelJump {
    margin-top: 18px;
    text-align: center;
    width: 100%;
    padding: 0 16px;
  }
  .lj-label {
    font-size: 9px;
    color: #0af;
    letter-spacing: 2px;
    margin-bottom: 8px;
    font-family: 'Orbitron', monospace;
  }
  .lj-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }
  .lj-btn {
    background: rgba(0,150,255,0.15);
    border: 1px solid rgba(0,200,255,0.5);
    border-radius: 20px;
    padding: 5px 12px;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    color: #0af;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .lj-btn:hover, .lj-btn:active {
    background: rgba(0,180,255,0.35);
    border-color: #0af;
    color: #fff;
    transform: scale(1.06);
  }

  .final-score {
    font-size: 13px;
    color: #888;
    letter-spacing: 2px;
    margin-bottom: 6px;
    font-family: 'Rajdhani', sans-serif;
  }
  .final-score span { color: #fc0; font-weight: 700; font-size: 22px; }

  #levelUpMsg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #levelUpMsg.show { opacity: 1; }
  .lu-text {
    display: none; /* LEVEL UP! 글자 숨김 */
  }
  .lu-sub {
    font-size: 26px;
    font-weight: 900;
    color: #fc0;
    letter-spacing: 2px;
    text-shadow: 0 0 20px #fc0, 0 0 40px #f80;
    font-family: 'Orbitron', monospace;
    line-height: 1.3;
  }

  /* 직접 터치 조종 - 조이스틱 없음 */
  #touchOverlay {
    position: absolute;
    inset: 0;
    z-index: 9;
    touch-action: none;
  }

  /* ── 폭탄 패널 ── */
  #bombPanel {
    position: absolute;
    left: 10px;
    bottom: 48px;
    z-index: 11;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: auto;
  }
  .bomb-icon {
    font-size: 28px;
    line-height: 1;
    filter: drop-shadow(0 0 6px #ff0) drop-shadow(0 0 12px #f80);
    transition: opacity 0.2s;
  }
  .bomb-icon.used { opacity: 0.18; filter: none; }
  #fireBombBtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #f80;
    background: radial-gradient(circle, #ff4400, #880000);
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(255,100,0,0.7);
    margin-top: 2px;
    touch-action: manipulation;
  }
  #fireBombBtn:active { transform: scale(0.92); }
  #fireBombBtn:disabled { opacity: 0.3; border-color: #555; box-shadow: none; background: #333; }
</style>

    <div class="bomb-icon" id="bomb2"><svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="19" r="11" fill="#1a1a1a" stroke="#ffdd00" stroke-width="1.8"/><circle cx="16" cy="19" r="7" fill="none" stroke="#ff8800" stroke-width="1.2" opacity="0.7"/><line x1="16" y1="12" x2="16" y2="26" stroke="#ffdd00" stroke-width="1.2" opacity="0.6"/><line x1="9" y1="19" x2="23" y2="19" stroke="#ffdd00" stroke-width="1.2" opacity="0.6"/><circle cx="16" cy="19" r="2.8" fill="#ffdd00"/><rect x="14.5" y="6" width="3" height="5" rx="1.2" fill="#999"/><circle cx="16" cy="5" r="2.5" fill="#777" stroke="#ffdd00" stroke-width="1.2"/><path d="M18 4.5 Q22 1 25 4" stroke="#ffdd00" stroke-width="1.4" fill="none" stroke-linecap="round"/><circle cx="25" cy="4" r="1.4" fill="#ffdd00"/><circle cx="10" cy="10" r="2.5" fill="none" stroke="#ffcc00" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.55"/><circle cx="22" cy="10" r="2.5" fill="none" stroke="#ffcc00" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.55"/></svg></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('gameWrapper');

function resize() {
  canvas.width = wrapper.clientWidth;
  canvas.height = wrapper.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── GAME STATE ───
let state = {
  running: false,
  score: 0,
  level: 1,
  hp: 100,
  maxHp: 100,
  frame: 0,
  gameOver: false,
  distance: 0,   // 현재 비행 거리 (m)
};

let bestDistance = 0; // 최고 거리 기록 (게임 세션 간 유지)

// ─── PLAYER ───
let player = {
  x: 0, y: 0,
  w: 36, h: 36,
  speed: 4,
  dx: 0, dy: 0,
  invincible: 0,
  trail: [],
};

// ─── GUN LEVEL ───
let gunLevel = 0; // 0~4

// ─── ENTITIES ───
let bullets = [];
let enemyBullets = [];
let enemies = [];
let allies = [];
let allyBullets = [];
let patriots = [];    // 페트리어트 유도탄
let powerups = [];
let particles = [];
let stars = [];
let allySpawned = false; // 레벨7 아군 등장 여부
let bombCount = 2;       // 폭탄 수
let lightnings = [];     // 번개 이펙트
let bombLevel8Spawned = false; // 레벨8 폭탄 보너스

// ─── MEGA BOSS (레벨15) ───
let megaBoss = null;          // 메가보스 객체
let megaBossActive = false;   // 메가보스 전투 중
let megaBossDefeated = false; // 메가보스 격파 여부 (이번 게임)
let megaBossLaserState = 'off';
let megaBossLaserTimer = 0;

// ─── PINK BOSS (레벨22) ───
let pinkBoss = null;
let pinkBossActive = false;
let pinkBossDefeated = false;
let pinkBossCountdown = -1;      // 5,4,3,2,1 카운트다운 (-1=비활성)
let pinkBossCountdownTimer = 0;  // 카운트다운 프레임 타이머
let pinkBossReinforced = false;  // 30% 이하 지원군 소환 여부
const MB_LASER_OFF  = 80;
const MB_LASER_CHG  = 35;
const MB_LASER_FIRE = 60;

// ─── METEOR STORM (레벨16) ───
let meteors = [];
let meteorStormActive = false;
let meteorStormTimer = 0;
const METEOR_STORM_ON  = 300; // 5초 (60fps * 5)
const METEOR_STORM_OFF = 300; // 5초 휴식
const METEOR_ANGLE_RAD = (180 - 60) * Math.PI / 180; // 60도 오른쪽위→왼쪽아래
const METEOR_VX = Math.cos(METEOR_ANGLE_RAD) * 6;
const METEOR_VY = Math.sin(METEOR_ANGLE_RAD) * 6; // 아래로
let meteorSpawnTimer = 0;

// ─── VERTICAL METEOR RAIN (레벨20) ───
let vMeteors = [];
let vMeteorRainActive = false;
let vMeteorRainTimer = 0;
let vMeteorSpawnTimer = 0;
const V_METEOR_ON  = 1200; // 20초
const V_METEOR_OFF = 180; // 3초
let vMeteorRainAnnounced = false; // 진입 첫 알림 여부

// ─── INPUT ───
let keys = { up: false, down: false, left: false, right: false };
let fireTimer = 0;

// ─── STARS ───
function initStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      speed: Math.random() * 1.5 + 0.3,
      brightness: Math.random(),
    });
  }
}

function updateStars() {
  for (let s of stars) {
    s.y += s.speed;
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
    s.brightness = 0.4 + 0.6 * Math.abs(Math.sin(state.frame * 0.02 + s.x));
  }
}

function drawStars() {
  for (let s of stars) {
    ctx.globalAlpha = s.brightness;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── DRAW PLAYER ───
function drawPlayer() {
  if (player.invincible > 0 && Math.floor(state.frame / 4) % 2 === 0) return;

  // Trail
  for (let i = 0; i < player.trail.length; i++) {
    const t = player.trail[i];
    const alpha = (i / player.trail.length) * 0.3;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#0af';
    ctx.beginPath();
    ctx.arc(t.x + player.w/2, t.y + player.h/2, 8 * (i / player.trail.length), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const px = player.x, py = player.y, pw = player.w, ph = player.h;
  const cx = px + pw/2, cy = py + ph/2;

  // Engine glow
  const grd = ctx.createRadialGradient(cx, py + ph + 4, 0, cx, py + ph + 4, 18);
  grd.addColorStop(0, 'rgba(0,200,255,0.9)');
  grd.addColorStop(0.5, 'rgba(0,100,255,0.4)');
  grd.addColorStop(1, 'rgba(0,0,255,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.ellipse(cx, py + ph + 4 + Math.sin(state.frame*0.3)*3, 10, 18, 0, 0, Math.PI*2);
  ctx.fill();

  // Ship body
  ctx.fillStyle = '#0af';
  ctx.shadowColor = '#0af';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(cx, py);
  ctx.lineTo(px + pw*0.15, py + ph*0.85);
  ctx.lineTo(px, py + ph);
  ctx.lineTo(px + pw*0.35, py + ph*0.65);
  ctx.lineTo(cx, py + ph*0.75);
  ctx.lineTo(px + pw*0.65, py + ph*0.65);
  ctx.lineTo(px + pw, py + ph);
  ctx.lineTo(px + pw*0.85, py + ph*0.85);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.ellipse(cx, py + ph*0.35, 6, 9, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ─── DRAW ENEMY ───
function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x + e.w/2, e.y + e.h/2);
  if (e.angle) ctx.rotate(e.angle);

  switch (e.type) {
    case 'basic':
      // 🦀 집게발 외계인 (크랩형)
      ctx.shadowColor = '#ff3366';
      ctx.shadowBlur = 6;
      // 몸통 (납작한 타원)
      ctx.fillStyle = '#cc1144';
      ctx.beginPath();
      ctx.ellipse(0, 0, e.w*0.38, e.h*0.28, 0, 0, Math.PI*2);
      ctx.fill();
      // 등딱지 줄무늬
      ctx.strokeStyle = '#ff4488';
      ctx.lineWidth = 1.2;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(0, 0, e.w*(0.18+i*0.09), e.h*(0.14+i*0.06), 0, 0, Math.PI*2);
        ctx.stroke();
      }
      // 왼쪽 집게발
      ctx.fillStyle = '#ff2255';
      ctx.beginPath();
      ctx.moveTo(-e.w*0.38, 0);
      ctx.lineTo(-e.w*0.62, -e.h*0.32);
      ctx.lineTo(-e.w*0.52, -e.h*0.45);
      ctx.lineTo(-e.w*0.38, -e.h*0.28);
      ctx.closePath();

      bGrd.addColorStop(0.3, '#cc1100');
      bGrd.addColorStop(0.7, '#880000');
      bGrd.addColorStop(1, '#440000');
      ctx.fillStyle = bGrd;
      ctx.shadowColor = '#ff2200';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(0, -bh*0.52);
      ctx.lineTo(bw*0.24, -bh*0.32);
      ctx.lineTo(bw*0.3, bh*0.1);
      ctx.lineTo(bw*0.16, bh*0.5);
      ctx.lineTo(-bw*0.16, bh*0.5);
      ctx.lineTo(-bw*0.3, bh*0.1);
      ctx.lineTo(-bw*0.24, -bh*0.32);
      ctx.closePath();
      ctx.fill();
      // 갈비뼈 문양
      ctx.strokeStyle = 'rgba(255,100,50,0.45)';
      ctx.lineWidth = 1.5;
      [0.05, 0.22, 0.38].forEach(ly => {
        ctx.beginPath();
        ctx.moveTo(-bw*0.24, bh*ly); ctx.lineTo(bw*0.24, bh*ly); ctx.stroke();
      });
      // 해골 머리
      ctx.fillStyle = '#ffddcc';
      ctx.shadowColor = '#ff6644';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.ellipse(0, -bh*0.36, bw*0.2, bh*0.18, 0, 0, Math.PI*2);
      ctx.fill();
      // 눈구멍 (빨간 불꽃)
      ctx.fillStyle = '#ff0000';
      ctx.shadowColor = '#ff4400';
      ctx.shadowBlur = 7;
      const eyePulse = 0.7 + 0.3 * Math.abs(Math.sin(state.frame * 0.1));
      ctx.globalAlpha = eyePulse;
      ctx.beginPath(); ctx.ellipse(-bw*0.09, -bh*0.37, bw*0.065, bh*0.07, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( bw*0.09, -bh*0.37, bw*0.065, bh*0.07, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      // 코뼈
      ctx.fillStyle = '#cc9988';
      ctx.shadowBlur = 4;
      ctx.beginPath(); ctx.arc(0, -bh*0.3, bw*0.028, 0, Math.PI*2); ctx.fill();
      // 이빨
      ctx.fillStyle = '#ffffff';
      [-bw*0.1, -bw*0.05, 0, bw*0.05, bw*0.1].forEach(tx => {
        ctx.beginPath();
        ctx.moveTo(tx - bw*0.025, -bh*0.22);
        ctx.lineTo(tx, -bh*0.14);
        ctx.lineTo(tx + bw*0.025, -bh*0.22);
        ctx.closePath();
        ctx.fill();
      });
      // Boss HP bar
      ctx.shadowBlur = 4;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(-bw/2, bh/2 + 6, bw, 8);
      const hpRatio = e.hp / e.maxHp;
      const hpGrd = ctx.createLinearGradient(-bw/2, 0, bw/2, 0);
      hpGrd.addColorStop(0, '#f00'); hpGrd.addColorStop(0.5, '#f80'); hpGrd.addColorStop(1, '#ff0');
      ctx.fillStyle = hpGrd;
      ctx.fillRect(-bw/2, bh/2 + 6, bw * hpRatio, 8);
      break;
  }
  ctx.restore();
  ctx.shadowBlur = 4;
}

// ─── DRAW MEGA BOSS ───
function drawMegaBoss() {
  if (!megaBoss) return;
  const mb = megaBoss;
  const cx = mb.x + mb.r, cy = mb.y + mb.r;
  const r = mb.r;
  const t = state.frame;

  ctx.save();
  ctx.translate(cx, cy);

  // 외곽 회전 오라 (기괴한 느낌)
  for (let i = 0; i < 12; i++) {
    const ang = (i / 12) * Math.PI * 2 + t * 0.018;
    const wobble = r * 0.18 * Math.sin(t * 0.07 + i * 1.3);
    const ox = Math.cos(ang) * (r + wobble);
    const oy = Math.sin(ang) * (r + wobble);
    const spkR = 10 + 8 * Math.abs(Math.sin(t * 0.05 + i));
    ctx.beginPath();
    ctx.arc(ox, oy, spkR, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${270 + i * 8}, 100%, 60%, 0.5)`;
    ctx.shadowColor = '#bf00ff';
    ctx.shadowBlur = 18;
    ctx.fill();
  }

  // 외곽 글로우 링
  const outerGrd = ctx.createRadialGradient(0, 0, r * 0.7, 0, 0, r * 1.35);
  outerGrd.addColorStop(0, 'rgba(150,0,255,0)');
  outerGrd.addColorStop(0.6, 'rgba(150,0,255,0.18)');
  outerGrd.addColorStop(1, 'rgba(200,0,255,0.55)');
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.35, 0, Math.PI * 2);
  ctx.fillStyle = outerGrd;
  ctx.shadowBlur = 0;
  ctx.fill();

  // 메인 몸통 (불규칙 원형 - 기괴하게)
  ctx.beginPath();
  for (let i = 0; i <= 48; i++) {
    const ang = (i / 48) * Math.PI * 2;
    const noise = 1 + 0.13 * Math.sin(t * 0.04 + ang * 5)
                    + 0.08 * Math.sin(t * 0.07 + ang * 9)
                    + 0.05 * Math.sin(t * 0.11 + ang * 14);
    const rx = Math.cos(ang) * r * noise;
    const ry = Math.sin(ang) * r * noise;
    i === 0 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
  }
  ctx.closePath();
  const bodyGrd = ctx.createRadialGradient(-r*0.2, -r*0.2, 0, 0, 0, r);
  bodyGrd.addColorStop(0, '#cc44ff');
  bodyGrd.addColorStop(0.4, '#8800cc');
  bodyGrd.addColorStop(0.8, '#440088');
  bodyGrd.addColorStop(1, '#1a0033');
  ctx.fillStyle = bodyGrd;
  ctx.shadowColor = '#bf00ff';
  ctx.shadowBlur = 35;
  ctx.fill();

  // 내부 맥동 링들
  for (let ring = 0; ring < 3; ring++) {
    const rr = r * (0.35 + ring * 0.2) * (1 + 0.06 * Math.sin(t * 0.09 + ring * 2.1));
    ctx.beginPath();
    ctx.arc(0, 0, rr, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${180 + ring*20}, 0, 255, ${0.4 - ring * 0.1})`;
    ctx.lineWidth = 2.5 - ring * 0.5;
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#cc00ff';
    ctx.stroke();
  }

  // 눈 (1개, 중앙 큰 눈)
  {
    const eox = 0, eoy = -r * 0.08;
    const esize = r * 0.38; // 크게
    // 흰자 (약간 기울어진 타원)
    ctx.beginPath();
    ctx.ellipse(eox, eoy, esize, esize * 0.68, Math.sin(t * 0.025) * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 16;
    ctx.shadowColor = '#fff';
    ctx.fill();
    // 홍채 (보라)
    ctx.beginPath();
    ctx.ellipse(eox, eoy, esize * 0.62, esize * 0.62 * 0.68, Math.sin(t * 0.025) * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = '#cc00ff';
    ctx.shadowColor = '#cc00ff';
    ctx.shadowBlur = 18;
    ctx.fill();
    // 동공 (플레이어 방향으로 추적)
    const pdx = player.x + player.w/2 - cx;
    const pdy = player.y + player.h/2 - cy;
    const pdist = Math.hypot(pdx, pdy) || 1;
    const pupilOx = eox + (pdx / pdist) * esize * 0.22;
    const pupilOy = eoy + (pdy / pdist) * esize * 0.18;
    ctx.beginPath();
    ctx.ellipse(pupilOx, pupilOy, esize * 0.30, esize * 0.38, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#110011';
    ctx.shadowBlur = 0;
    ctx.fill();
    // 눈 핏줄 (8개, 흰자 전체로 뻗음)
    ctx.shadowBlur = 0;
    for (let v = 0; v < 8; v++) {
      const va = (v / 8) * Math.PI * 2;
      const vlen = 0.6 + 0.35 * Math.abs(Math.sin(t * 0.04 + v));
      ctx.strokeStyle = `rgba(255,0,80,${0.35 + 0.25 * Math.abs(Math.sin(t*0.03+v))})`;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(eox + Math.cos(va) * esize * 0.28, eoy + Math.sin(va) * esize * 0.28 * 0.68);
      ctx.lineTo(eox + Math.cos(va) * esize * vlen, eoy + Math.sin(va) * esize * vlen * 0.68);
      ctx.stroke();
    }
    // 반짝이는 하이라이트
    ctx.beginPath();
    ctx.ellipse(eox - esize*0.18, eoy - esize*0.22, esize*0.10, esize*0.07, -0.5, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fill();
  }

  // 입 (구불구불한 선)
  ctx.beginPath();
  ctx.moveTo(-r*0.35, r*0.32);
  for (let i = 0; i <= 8; i++) {
    const mx = -r*0.35 + (i / 8) * r * 0.7;
    const my = r*0.32 + Math.sin(i * 1.2 + t * 0.08) * r * 0.1;
    ctx.lineTo(mx, my);
  }
  ctx.strokeStyle = '#ff00aa';
  ctx.lineWidth = 3.5;
  ctx.shadowColor = '#ff00aa';
  ctx.shadowBlur = 14;
  ctx.stroke();

  // HP bar (보스 아래)
  ctx.shadowBlur = 0;
  const hpBarW = r * 2.2;
  const hpBarY = r + 14;
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(-hpBarW/2, hpBarY, hpBarW, 10);
  const hpR = mb.hp / mb.maxHp;
  const hpG2 = ctx.createLinearGradient(-hpBarW/2, 0, hpBarW/2, 0);
  hpG2.addColorStop(0, '#7700ff'); hpG2.addColorStop(0.5, '#cc00ff'); hpG2.addColorStop(1, '#ff44ff');
  ctx.fillStyle = hpG2;
  ctx.fillRect(-hpBarW/2, hpBarY, hpBarW * hpR, 10);
  ctx.strokeStyle = 'rgba(200,0,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(-hpBarW/2, hpBarY, hpBarW, 10);

  ctx.restore();
  ctx.shadowBlur = 0;

  // 메가보스 레이저 그리기
  drawMegaBossLaser(cx, cy, r);
}

// ─── MEGA BOSS LASER DRAW ───
function drawMegaBossLaser(cx, cy, r) {
  if (megaBossLaserState === 'off') return;
  const lx = megaBoss ? megaBoss.laserTargetX : cx;

  if (megaBossLaserState === 'charge') {
    const alpha = 0.25 + 0.75 * Math.abs(Math.sin(megaBossLaserTimer * 0.25));
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ff00ff';
    ctx.shadowColor = '#ff00ff';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 7]);
    ctx.beginPath();
    ctx.moveTo(lx, cy + r);
    ctx.lineTo(lx, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  } else if (megaBossLaserState === 'fire') {
    const prog = megaBossLaserTimer / MB_LASER_FIRE;
    const alpha = prog < 0.75 ? 1 : 1 - (prog - 0.75) / 0.25;
    ctx.globalAlpha = alpha;
    // 외곽 글로우
    ctx.strokeStyle = '#ff88ff';
    ctx.shadowColor = '#cc00ff';
    ctx.shadowBlur = 32;
    ctx.lineWidth = 22;
    ctx.globalAlpha = alpha * 0.22;
    ctx.beginPath(); ctx.moveTo(lx, cy + r); ctx.lineTo(lx, canvas.height); ctx.stroke();
    // 중간 글로우
    ctx.lineWidth = 10;
    ctx.globalAlpha = alpha * 0.55;
    ctx.strokeStyle = '#dd00ff';
    ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.moveTo(lx, cy + r); ctx.lineTo(lx, canvas.height); ctx.stroke();
    // 코어
    ctx.lineWidth = 4;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffaaff';
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(lx, cy + r); ctx.lineTo(lx, canvas.height); ctx.stroke();
    // 발사구 섬광
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ff00ff';
    ctx.shadowBlur = 25;
    ctx.beginPath(); ctx.arc(lx, cy + r, 8, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
  }
}

// ─── MEGA BOSS SPAWN ───
// ─── PINK BOSS (레벨22) ───
function spawnPinkBoss() {
  const r = 38;
  const hp = 12000;
  pinkBoss = {
    x: canvas.width / 2 - r,
    y: 28,
    r,
    hp,
    maxHp: hp,
    moveDir: 1,
    moveSpeed: 2.8,
    shootTimer: 0,
    countdownActive: false,
    dead: false,
  };
  pinkBossActive = true;
  pinkBossDefeated = false;
  pinkBossReinforced = false;
  pinkBossCountdown = -1;
  pinkBossCountdownTimer = 0;
  // 첫 카운트다운 5초 후 시작
  setTimeout(() => {
    if (pinkBoss) startPinkBossCountdown();
  }, 3000);
}

function startPinkBossCountdown() {
  if (!pinkBoss || !pinkBossActive) return;
  pinkBossCountdown = 5;
  pinkBossCountdownTimer = 0;
}

function drawPinkBoss() {
  if (!pinkBoss) return;
  const pb = pinkBoss;
  const cx = pb.x + pb.r;
  const cy = pb.y + pb.r;
  const r = pb.r;
  const t = state.frame;

  ctx.save();
  ctx.translate(cx, cy);

  // 외곽 글로우
  const outerGrd = ctx.createRadialGradient(0, 0, r * 0.6, 0, 0, r * 1.5);
  outerGrd.addColorStop(0, 'rgba(255,100,180,0)');
  outerGrd.addColorStop(0.5, 'rgba(255,80,160,0.2)');
  outerGrd.addColorStop(1, 'rgba(255,50,140,0.5)');
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.5, 0, Math.PI * 2);
  ctx.fillStyle = outerGrd;
  ctx.fill();

  // 귀여운 공 몸통 (핑크 그라디언트)
  const bodyGrd = ctx.createRadialGradient(-r*0.25, -r*0.25, 0, 0, 0, r);
  bodyGrd.addColorStop(0, '#ffb8e0');
  bodyGrd.addColorStop(0.4, '#ff69b4');
  bodyGrd.addColorStop(0.8, '#e0006a');
  bodyGrd.addColorStop(1, '#990040');
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = bodyGrd;
  ctx.shadowColor = '#ff44aa';
  ctx.shadowBlur = 22;
  ctx.fill();

  // 반짝이 하이라이트
  ctx.beginPath();
  ctx.arc(-r*0.28, -r*0.3, r*0.22, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.shadowBlur = 0;
  ctx.fill();

  // 귀여운 눈 두 개
  const eyeY = -r * 0.1;
  const eyeX = r * 0.28;
  for (const ex of [-eyeX, eyeX]) {
    // 흰자
    ctx.beginPath();
    ctx.ellipse(ex, eyeY, r*0.14, r*0.17, 0, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.fill();
    // 동공
    ctx.beginPath();
    ctx.arc(ex + r*0.03, eyeY + r*0.04, r*0.08, 0, Math.PI*2);
    ctx.fillStyle = '#222';
    ctx.fill();
    // 반짝이
    ctx.beginPath();
    ctx.arc(ex + r*0.05, eyeY, r*0.03, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }

  // 볼터치 (빨간 볼)
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#ff3388';
  ctx.beginPath(); ctx.ellipse(-r*0.42, r*0.2, r*0.16, r*0.1, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r*0.42, r*0.2, r*0.16, r*0.1, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // 귀 (작은 반원 2개)
  ctx.fillStyle = '#ff44aa';
  ctx.shadowColor = '#ff44aa';
  ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(-r*0.6, -r*0.75, r*0.22, Math.PI, 0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc( r*0.6, -r*0.75, r*0.22, Math.PI, 0); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();

  // HP바
  const barW = r * 3;
  const barX = cx - barW / 2;
  const barY = pb.y - 14;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(barX, barY, barW, 7);
  const hpRatio = Math.max(0, pb.hp / pb.maxHp);
  const hpGrd = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  hpGrd.addColorStop(0, '#ff44aa');
  hpGrd.addColorStop(0.5, '#ff88cc');
  hpGrd.addColorStop(1, '#ffbbdd');
  ctx.fillStyle = hpGrd;
  ctx.fillRect(barX, barY, barW * hpRatio, 7);
  ctx.strokeStyle = 'rgba(255,100,180,0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, 7);

  // 카운트다운 표시
  if (pinkBossCountdown > 0) {
    ctx.save();
    ctx.textAlign = 'center';
    const cdAlpha = 0.6 + 0.4 * Math.abs(Math.sin(state.frame * 0.2));
    ctx.globalAlpha = cdAlpha;
    ctx.font = `bold ${36 + (5 - pinkBossCountdown) * 4}px Orbitron, monospace`;
    ctx.fillStyle = '#ff2288';
    ctx.shadowColor = '#ff44aa';
    ctx.shadowBlur = 24;
    ctx.fillText(pinkBossCountdown, cx, cy + r + 48);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

function updatePinkBoss() {
  if (!pinkBoss || !pinkBossActive) return;
  const pb = pinkBoss;
  const cx = pb.x + pb.r;
  const cy = pb.y + pb.r;

  // 좌우 이동만 (내려오지 않음)
  pb.x += pb.moveDir * (pb.moveSpeed + Math.sin(state.frame * 0.03) * 0.8);
  if (pb.x <= 8 || pb.x + pb.r * 2 >= canvas.width - 8) pb.moveDir *= -1;
  pb.y = 28 + Math.sin(state.frame * 0.022) * 10; // 미세 상하 출렁

  // 카운트다운 처리
  if (pinkBossCountdown > 0) {
    pinkBossCountdownTimer++;
    if (pinkBossCountdownTimer >= 60) { // 1초마다
      pinkBossCountdownTimer = 0;
      pinkBossCountdown--;
      if (pinkBossCountdown === 0) {
        // 카운트다운 끝 → 유도탄 폭발 발사
        firePinkBossVolley();
        pinkBossCountdown = -1;
        // 4초 후 다시 카운트다운
        setTimeout(() => { if (pinkBoss && pinkBossActive) startPinkBossCountdown(); }, 4000);
      }
    }
  }

  // 카운트다운 중 일반 조준탄 발사 없음, 카운트다운 외 구간엔 느린 산탄
  if (pinkBossCountdown < 0) {
    pb.shootTimer++;
    if (pb.shootTimer >= 70) {
      pb.shootTimer = 0;
      const dx = player.x + player.w/2 - cx;
      const dy = player.y + player.h/2 - cy;
      const dist = Math.hypot(dx, dy) || 1;
      const spd = 2.5;
      for (const da of [-0.25, 0, 0.25]) {
        const ang = Math.atan2(dy, dx) + da;
        enemyBullets.push({ x: cx-4, y: cy+pb.r, w: 8, h: 8,
          vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, dmg: 10, color: '#ff88cc' });
      }
    }
  }

  // 30% 이하: 지원군 basic 적 우르르 소환 (1회)
  if (!pinkBossReinforced && pb.hp / pb.maxHp <= 0.30) {
    pinkBossReinforced = true;
    const el2 = document.getElementById('levelUpMsg');
    const sub2 = document.getElementById('luSubText');
    sub2.style.color = '#ff4444';
    sub2.style.textShadow = '0 0 20px #ff0000';
    sub2.textContent = '⚠ 지원군 출격!';
    el2.classList.add('show');
    setTimeout(() => {
      el2.classList.remove('show');
      sub2.style.color = '#fc0';
      sub2.style.textShadow = '0 0 20px #fc0, 0 0 40px #f80';
    }, 2000);
    // basic 적 200마리 순차 스폰 — 체력 10배(10), 속도 3배
    for (let i = 0; i < 200; i++) {
      setTimeout(() => {
        if (!state.running) return;
        const W = canvas.width;
        enemies.push({
          type: 'basic', x: Math.random() * (W - 28), y: -28 - Math.random() * 120,
          w: 28, h: 28, hp: 10, maxHp: 10,
          speed: (2.0 + Math.random() * 2.0) * 3, // 속도 3배
          score: 10, shootTimer: 0, angle: 0,
          sinOffset: Math.random() * Math.PI * 2,
        });
      }, i * 25);
    }
  }

  // 플레이어 총알 충돌
  for (const b of bullets) {
    if (b.life === 0) continue;
    const bx = b.x + b.w/2, by = b.y + (b.h||14)/2;
    if (Math.hypot(bx - cx, by - cy) < pb.r) {
      pb.hp -= (b.dmg || 1);
      b.life = 0;
      if (Math.random() < 0.15) spawnParticles(bx, by, '#ff88cc', 5);
    }
  }

  // 격파
  if (pb.hp <= 0) {
    for (let i = 0; i < 60; i++) {
      spawnParticles(cx + (Math.random()-0.5)*pb.r*2, cy + (Math.random()-0.5)*pb.r*2, '#ff44aa', 6);

// ─── MEGA BOSS UPDATE ───
function updateMegaBoss() {
  if (!megaBoss || !megaBossActive) return;
  const mb = megaBoss;
  const cx = mb.x + mb.r;
  const cy = mb.y + mb.r;

  // 좌우 진동 이동 (상단에서 물결치듯)
  mb.x += mb.moveDir * (2.2 + Math.sin(state.frame * 0.04) * 1.2);
  if (mb.x <= 10 || mb.x + mb.r * 2 >= canvas.width - 10) mb.moveDir *= -1;
  // 약간 위아래 출렁임
  mb.y = 30 + Math.sin(state.frame * 0.025) * 18;

  // ── 미사일 발사 (매우 빈번) ──
  mb.shootTimer++;
  const shootRate = 18; // 18프레임마다 발사
  if (mb.shootTimer >= shootRate) {
    mb.shootTimer = 0;
    const phase = Math.floor(state.frame / 60) % 4;
    if (phase === 0) {
      // 방사형 8방 (플레이어 조준 중심)
      const baseAng = Math.atan2(player.y + player.h/2 - cy, player.x + player.w/2 - cx);
      for (let i = 0; i < 8; i++) {
        const ang = baseAng + (i / 8) * Math.PI * 2;
        const spd = 4.5;
        enemyBullets.push({ x: cx-5, y: cy-5, w: 10, h: 10, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, dmg: 14, color: '#dd00ff' });
      }
    } else if (phase === 1) {
      // 3줄 집중탄 (아래쪽 향해)
      for (let i = -3; i <= 3; i++) {
        const spd = 5 + Math.abs(i) * 0.3;
        enemyBullets.push({ x: cx + i*18 - 5, y: cy + mb.r, w: 9, h: 9, vx: i * 0.4, vy: spd, dmg: 16, color: '#ff44ff' });
      }
    } else if (phase === 2) {
      // 나선형 발사
      const spiralAng = (state.frame * 0.18) % (Math.PI * 2);
      for (let i = 0; i < 3; i++) {
        const ang = spiralAng + (i / 3) * Math.PI * 2;
        enemyBullets.push({ x: cx-5, y: cy-5, w: 9, h: 9, vx: Math.cos(ang)*5, vy: Math.sin(ang)*5, dmg: 12, color: '#aa00ff' });
      }
    } else {
      // 플레이어 정조준 고속탄 2발
      const dx = player.x + player.w/2 - cx;
      const dy = player.y + player.h/2 - cy;
      const dist = Math.hypot(dx, dy) || 1;
      for (let s = -1; s <= 1; s += 2) {
        const perp = 14;
        enemyBullets.push({ x: cx + (dy/dist)*perp*s - 4, y: cy - (dx/dist)*perp*s - 4, w: 9, h: 9,
          vx: (dx/dist)*7, vy: (dy/dist)*7, dmg: 20, color: '#ff00aa' });
      }
    }
  }

  // ── 레이저 사이클 ──
  megaBossLaserTimer++;
  if (megaBossLaserState === 'off') {
    if (megaBossLaserTimer >= MB_LASER_OFF) {
      megaBossLaserState = 'charge';
      megaBossLaserTimer = 0;
      mb.laserTargetX = player.x + player.w / 2; // 조준 위치 고정
    }
  } else if (megaBossLaserState === 'charge') {
    // 충전 중 조준선 플레이어 따라가기
    mb.laserTargetX += (player.x + player.w/2 - mb.laserTargetX) * 0.07;
    if (megaBossLaserTimer >= MB_LASER_CHG) {
      megaBossLaserState = 'fire';
      megaBossLaserTimer = 0;
    }
  } else if (megaBossLaserState === 'fire') {
    // 레이저 데미지
    const lx0 = mb.laserTargetX - 8;
    const lx1 = mb.laserTargetX + 8;
    if (player.invincible <= 0 &&
        player.x + player.w > lx0 && player.x < lx1 &&
        player.y > cy + mb.r) {
      state.hp -= 2; // 프레임당 2씩
      player.invincible = 4;
    }
    if (megaBossLaserTimer >= MB_LASER_FIRE) {
      megaBossLaserState = 'off';
      megaBossLaserTimer = 0;
    }
  }

  // ── 플레이어 총알 충돌 ──
  for (const b of bullets) {
    if (b.life === 0) continue;
    const bx = b.x + b.w/2, by = b.y + (b.h||14)/2;
    if (Math.hypot(bx - cx, by - cy) < mb.r) {
      mb.hp -= (b.dmg || 1);
      b.life = 0;
      if (Math.random() < 0.12) spawnParticles(bx, by, '#dd00ff', 5);
    }
  }

  // ── 격파 판정 ──
  if (mb.hp <= 0) {
    // 폭발 파티클
    for (let i = 0; i < 80; i++) {
      spawnParticles(cx + (Math.random()-0.5)*mb.r*2, cy + (Math.random()-0.5)*mb.r*2, '#cc00ff', 6);
      spawnParticles(cx + (Math.random()-0.5)*mb.r*2, cy + (Math.random()-0.5)*mb.r*2, '#ff88ff', 4);
    }
    triggerLightning();
    megaBoss = null;
    megaBossActive = false;
    megaBossDefeated = true;
    megaBossLaserState = 'off';
    // 16레벨로 승급 + 메시지
    state.level = 15;
    showLevelUp();
    const el = document.getElementById('levelUpMsg');
    document.getElementById('luSubText').textContent = '💜 메가보스 격파! LEVEL 15 진입!';
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3000);
    document.getElementById('levelDisplay').textContent = '15';
  }
}

function spawnEnemy() {
  const W = canvas.width, H = canvas.height;

  // 레벨별 적 등장 확률 - 레벨 올라갈수록 강한 적이 급격히 증가

  else if (lv >= 6 && r < 0.30)  type = 'sniper';   // 새: 플레이어 직선 조준 빠른 탄
  else if (lv >= 4 && r < 0.45)  type = 'tank';
  else if (lv >= 2 && r < 0.55)  type = 'shooter';  // 레벨2부터 등장
  else if (lv >= 2 && r < 0.70)  type = 'fast';
  // 나머지 basic

  // 레벨7 전용: sniper(노란적) 4배 빈도 — r < 0.30 이외 구간에서도 추가 sniper 뽑기
  if (lv === 7 && type !== 'sniper' && Math.random() < 0.60) type = 'sniper';

  // sniper 등장 제한 조정
  if (type === 'sniper') {
    if (lv === 7) {
      // 레벨7: sniper 4배 — 필터 없이 그대로 통과
    } else {
      if (Math.random() < 0.667) type = 'basic';
    }
  }

  // 레벨21 이상: ghost 타입 강제 스폰
  if (lv >= 21) type = 'ghost';

  // 레벨8 이상: 보스 출현 갯수 1/2로 (50% 확률로 basic 교체)

  const lvScale = Math.pow(1.35, lv - 1) * (lv >= 8 ? 0.6 : 1);

    fast:    { w: 20, h: 20, hp: 1,                                               maxHp: 1,                                               speed: 3.5 + lv * 0.4,  score: 20,  shootTimer: 0 },
    tank:    { w: 44, h: 44, hp: Math.ceil(3 * lvScale),                          maxHp: Math.ceil(3 * lvScale),                          speed: 0.7 + lv * 0.12, score: 60,  shootTimer: 0 },
    shooter: { w: 32, h: 32, hp: Math.ceil(2 * lvScale),                          maxHp: Math.ceil(2 * lvScale),                          speed: 1.0 + lv * 0.18, score: 40,  shootTimer: Math.floor(Math.random()*40) },
    sniper:  { w: 28, h: 28, hp: Math.ceil((1.5 * lvScale) * (lv === 7 ? 0.5 : 1)), maxHp: Math.ceil((1.5 * lvScale) * (lv === 7 ? 0.5 : 1)), speed: 0.8 + lv * 0.1,  score: 60,  shootTimer: Math.floor(Math.random()*30) },
    boss:    { w: 72, h: 72, hp: Math.ceil(40 * lvScale * bossHpScale),           maxHp: Math.ceil(40 * lvScale * bossHpScale),           speed: 0.7 + lv*0.05,   score: 500, shootTimer: 0, moveDir: 1 },
    ghost:   { w: 36, h: 36, hp: Math.ceil(4 * lvScale * 0.4),                   maxHp: Math.ceil(4 * lvScale * 0.4),                   speed: 1.2 + lv * 0.08, score: 150, shootTimer: Math.floor(Math.random()*50) },
  };

// ─── FIRE BULLET (무한 강화) ───
// 5단계마다 색상 테마 바뀌고, 패턴은 5사이클로 반복
// ─── BULLET POWER SYSTEM ───
// gunLevel에 따라 데미지 계산: 1 + 0.4 per level (소수점 올림)
function getBulletDmg() {
  return Math.ceil(1 + gunLevel * 0.4);
}

// gunLevel에 따라 파란색→보라→주황→빨간색으로 점진적 변화
function getBulletColor(intensity) {
  // intensity: 0(약함)~1(강함), gunLevel 기반
  const t = Math.min(1, gunLevel / 30); // 30레벨에서 완전 빨강
  // 파랑(0,150,255) → 보라(180,50,255) → 주황(255,140,0) → 빨강(255,30,30)
  let r, g, b;
  if (t < 0.33) {
    const s = t / 0.33;
    r = Math.round(0   + s * 180);
    g = Math.round(150 - s * 100);
    b = Math.round(255 + s * 0);
  } else if (t < 0.66) {
    const s = (t - 0.33) / 0.33;
    r = Math.round(180 + s * 75);
    g = Math.round(50  + s * 90);
    b = Math.round(255 - s * 255);
  } else {
    const s = (t - 0.66) / 0.34;
    r = Math.round(255);
    g = Math.round(140 - s * 110);
    b = Math.round(0);
  }
  // intensity로 밝기 조절 (중앙 메인은 밝게, 보조는 약간 어둡게)
  const factor = intensity !== undefined ? intensity : 1;
  return `rgb(${Math.round(r*factor)},${Math.round(g*factor)},${Math.round(b*factor)})`;
}

const GUN_COLOR_TIERS = [
  { main: '#00cfff', side: '#7deeff', extra: '#aaf5ff' },  // 파랑
  { main: '#ff8800', side: '#ffbb55', extra: '#ffdcaa' },  // 주황
  { main: '#cc00ff', side: '#ee77ff', extra: '#f5ccff' },  // 보라
  { main: '#ff1055', side: '#ff6699', extra: '#ffccdd' },  // 빨강
  { main: '#00ff88', side: '#77ffcc', extra: '#ccffee' },  // 초록
];

function fireBullet() {
  const cx = player.x + player.w / 2;
  const cy = player.y;
  const dmg = getBulletDmg();
  const mainColor  = getBulletColor(1.0);
  const sideColor  = getBulletColor(0.8);
  const outerColor = getBulletColor(0.65);
  const diagColor  = getBulletColor(0.75);

  if (gunLevel === 0) {
    bullets.push({ x: cx - 3, y: cy, w: 6, h: 14, vy: -13, type: 'normal', color: mainColor, dmg });
    return;
  }

  const tier  = Math.floor((gunLevel - 1) / 5);
  const cycle = (gunLevel - 1) % 5;

  // 중앙 메인 (항상 발사)
  bullets.push({ x: cx - 3, y: cy, w: 6, h: 14, vy: -13, type: 'normal', color: mainColor, dmg });

  // cycle 1+: 좌우 추가
  if (cycle >= 1) {
    const sc = cycle >= 2 ? mainColor : sideColor;
    bullets.push({ x: cx - 16, y: cy + 4, w: 5, h: 12, vy: -13, type: 'normal', color: sc, dmg });
    bullets.push({ x: cx + 10, y: cy + 4, w: 5, h: 12, vy: -13, type: 'normal', color: sc, dmg });
  }

  // cycle 3+: 바깥 좌우 추가
  if (cycle >= 3) {
    const oc = cycle >= 4 ? mainColor : outerColor;
    bullets.push({ x: cx - 29, y: cy + 8, w: 4, h: 10, vy: -13, type: 'normal', color: oc, dmg });
    bullets.push({ x: cx + 23, y: cy + 8, w: 4, h: 10, vy: -13, type: 'normal', color: oc, dmg });
  }

  // tier 1+(gunLevel 6+): 대각선 미사일 추가
  if (tier >= 1) {
    for (let t = 1; t <= tier; t++) {
      const spread = 0.18 * t;
      bullets.push({ x: cx - 3, y: cy, w: 4, h: 10, vx: -Math.sin(spread) * 13, vy: -Math.cos(spread) * 13, type: 'normal', color: diagColor, dmg });
      bullets.push({ x: cx - 3, y: cy, w: 4, h: 10, vx:  Math.sin(spread) * 13, vy: -Math.cos(spread) * 13, type: 'normal', color: diagColor, dmg });
    }
  }
}



// ─── LASER SYSTEM (gunLevel 10+) ───
let laserState = 'off';   // 'charge' | 'fire' | 'off'
let laserTimer  = 0;
const LASER_OFF_DUR    = 90;   // 텀 (프레임)
const LASER_CHARGE_DUR = 28;   // 충전 시간
const LASER_FIRE_DUR   = 48;   // 발사 지속

// gunLevel 10부터 1줄, 이후 3레벨마다 1줄 추가 (10, 13, 16, 19, ...)
function getLaserCount() {
  if (gunLevel < 10) return 0;
  return Math.min(3, 1 + Math.floor((gunLevel - 10) / 3)); // 최대 3개
}

// 레이저 줄의 X 위치들 (플레이어 중심 기준으로 좌우 균등 배치)
function getLaserXPositions() {
  const cx = player.x + player.w / 2;
  const count = getLaserCount();
  const positions = [];
  const gap = 18;
  for (let i = 0; i < count; i++) {
    const offset = (i - (count - 1) / 2) * gap;
    positions.push(cx + offset);
  }
  return positions;
}

function updateLaser() {
  if (getLaserCount() === 0) { laserState = 'off'; laserTimer = 0; return; }

  laserTimer++;

  if (laserState === 'off') {
    if (laserTimer >= LASER_OFF_DUR) { laserState = 'charge'; laserTimer = 0; }

  } else if (laserState === 'charge') {
    if (laserTimer >= LASER_CHARGE_DUR) { laserState = 'fire'; laserTimer = 0; }

  } else if (laserState === 'fire') {
    // 레이저가 켜진 동안 매 프레임 적/적탄에 데미지
    const xs = getLaserXPositions();
    const laserW = 10 + getLaserCount() * 2;
    const dmg = Math.ceil(getBulletDmg() * 0.8);

    for (const lx of xs) {
      const lx0 = lx - laserW / 2;
      // 적 미사일 요격 (immune 탄은 레이저로도 파괴 불가)
      for (const b of enemyBullets) {
        if (b.immune) continue;
        if (!b.dead && b.x + b.w > lx0 && b.x < lx0 + laserW) {
          b.dead = true;
          if (Math.random() < 0.3) spawnParticles(b.x, b.y, '#ffe066', 3);
        }
      }
      // 적 데미지
      for (const e of enemies) {
        if (e.x + e.w > lx0 && e.x < lx0 + laserW) {
          e.hp -= dmg;
          if (Math.random() < 0.08) spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ffe066', 4);
        }
      }
    }

    if (laserTimer >= LASER_FIRE_DUR) { laserState = 'off'; laserTimer = 0; }
  }
}

function drawLaser() {
  const count = getLaserCount();
  if (count === 0 || laserState === 'off') return;

  const xs = getLaserXPositions();
  const py = player.y;

  if (laserState === 'charge') {
    // 충전: 가늘고 깜빡이는 예비선
    const alpha = 0.3 + 0.7 * Math.abs(Math.sin(laserTimer * 0.35));
    ctx.globalAlpha = alpha;
    for (const lx of xs) {
      ctx.strokeStyle = '#ffe066';
      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(lx, py);
      ctx.lineTo(lx, 0);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

  } else if (laserState === 'fire') {
    // 발사: 굵고 밝은 노란 레이저
    const progress = laserTimer / LASER_FIRE_DUR;
    // 끝부분에서 서서히 희미해짐
    const alpha = progress < 0.7 ? 1 : 1 - (progress - 0.7) / 0.3;
    const laserW = 6 + getLaserCount() * 2;

    ctx.globalAlpha = alpha;
    for (const lx of xs) {
      // 외곽 글로우
      ctx.strokeStyle = '#fff8aa';
      ctx.shadowColor = '#ffee00';
      ctx.shadowBlur = 28;
      ctx.lineWidth = laserW + 8;
      ctx.globalAlpha = alpha * 0.25;
      ctx.beginPath();
      ctx.moveTo(lx, py);
      ctx.lineTo(lx, 0);
      ctx.stroke();

      // 중간 글로우
      ctx.shadowBlur = 16;
      ctx.lineWidth = laserW + 3;
      ctx.globalAlpha = alpha * 0.55;
      ctx.strokeStyle = '#ffe033';
      ctx.beginPath();
      ctx.moveTo(lx, py);
      ctx.lineTo(lx, 0);
      ctx.stroke();

      // 코어 (밝은 흰-노랑)
      ctx.shadowBlur = 10;
      ctx.lineWidth = laserW;
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#ffff99';
      ctx.beginPath();
      ctx.moveTo(lx, py);
      ctx.lineTo(lx, 0);
      ctx.stroke();

      // 발사구 섬광
      ctx.globalAlpha = alpha * 0.9;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffee00';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(lx, py, laserW * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
  }
}

// ─── UPDATE BULLETS ───
function updateBullets() {
  for (let b of bullets) {
    b.x += b.vx || 0;
    b.y += b.vy || 0;
  }
  bullets = bullets.filter(b => b.y > -50 && b.y < canvas.height + 50 && b.x > -100 && b.x < canvas.width + 100 && b.life !== 0);
  // 플레이어 총알 상한 200개
  if (bullets.length > 200) bullets.splice(0, bullets.length - 200);

  // Enemy bullets
  for (let b of enemyBullets) {
    // homing 탄: 매 프레임 플레이어 방향으로 조금씩 꺾임 (원호 궤적)
    if (b.homing && b.homingRate) {
      const tx = player.x + player.w / 2 - (b.x + b.w / 2);
      const ty = player.y + player.h / 2 - (b.y + b.h / 2);
      const tLen = Math.hypot(tx, ty) || 1;
      // 현재 속도 방향을 목표 방향으로 homingRate만큼 선형 보간
      b.vx += (tx / tLen * b.speed - b.vx) * b.homingRate;
      b.vy += (ty / tLen * b.speed - b.vy) * b.homingRate;
      // 속도 크기 유지
      const curSpd = Math.hypot(b.vx, b.vy) || 1;
      b.vx = b.vx / curSpd * b.speed;
      b.vy = b.vy / curSpd * b.speed;
    }
    b.x += b.vx || 0;
    b.y += b.vy || 0;
    if (player.invincible <= 0 &&
        b.x < player.x+player.w && b.x+b.w > player.x &&
        b.y < player.y+player.h && b.y+b.h > player.y) {
      state.hp -= b.dmg || 10;
      player.invincible = 90;
      spawnParticles(player.x+player.w/2, player.y+player.h/2, '#f00', 15);
      b.dead = true;
    }
  }
  enemyBullets = enemyBullets.filter(b => b.y < canvas.height + 30 && b.y > -20 && b.x > -20 && b.x < canvas.width + 20 && !b.dead);
  // 적 총알 상한 400개 (오래된 것부터 제거)
  if (enemyBullets.length > 400) enemyBullets.splice(0, enemyBullets.length - 400);
}

// ─── DRAW BULLETS ───
function drawBullets() {
  const glow = Math.min(8 + gunLevel * 1.2, 28); // 레벨 높을수록 글로우 강해짐
  for (let b of bullets) {
    ctx.shadowBlur = glow;
    ctx.shadowColor = b.color;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.rect(b.x - b.w/2, b.y, b.w, b.h);
    ctx.fill();
    ctx.shadowBlur = 3;
  }

  for (let b of enemyBullets) {
    const bColor = b.color || '#f8f';
    ctx.fillStyle = bColor;
    ctx.shadowColor = bColor;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(b.x + b.w/2, b.y + b.h/2, b.w/2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 3;
}

// ─── UPDATE ENEMIES ───
function updateEnemies() {
  for (let e of enemies) {
    e.angle = (e.angle || 0) + 0.03;
    const lv = state.level;

    if (e.type === 'boss') {
      e.x += e.speed * e.moveDir;
      if (e.x <= 0 || e.x + e.w >= canvas.width) e.moveDir *= -1;
      e.y += 0.4 + lv * 0.05;
      e.shootTimer++;
      // 레벨 높을수록 빠르게 발사 — 레벨8 이상은 발사속도 더 느리게
      const bossRate = Math.max(21, 82 - lv * 7) * (lv >= 8 ? 3 : 1);
      if (e.shootTimer >= bossRate) {
        e.shootTimer = 0;
        if (e.y + e.h >= canvas.height * 0.8 && Math.random() > 0.2) { /* 하단 20% 구역: 20% 확률로만 발사 */ }
        else if (lv >= 8) {
          // 레벨8 이상: 정확히 4발 고정 (좌·중좌·중우·우)
          const spd = (3 + lv * 0.3) * 0.4;
          const dmg = (12 + lv * 2) * 0.4;
          const angles = [-40, -13, 13, 40];
          for (const a of angles) {
            const rad = (a + 90) * Math.PI / 180;
            enemyBullets.push({ x: e.x+e.w/2-4, y: e.y+e.h, w: 9, h: 9, vx: Math.cos(rad)*spd, vy: Math.sin(rad)*spd, dmg });
          }
        } else {
          const spread = Math.min(80, 40 + lv * 5);
          const step = lv >= 7 ? 15 : 20;
          for (let a = -spread; a <= spread; a += step) {
            const rad = (a + 90) * Math.PI / 180;
            const spd = 3 + lv * 0.3;
            const dmg = 12 + lv * 2;
            enemyBullets.push({ x: e.x+e.w/2-4, y: e.y+e.h, w: 9, h: 9, vx: Math.cos(rad)*spd, vy: Math.sin(rad)*spd, dmg });
          }
        }
      }

    } else if (e.type === 'sniper') {
      // 거의 안 내려오고 빠른 조준탄 발사
      e.y += e.speed * 0.3;
      e.x += Math.sin(state.frame * 0.04 + e.sinOffset) * 1.2;
      e.shootTimer++;
      const sniperRate = Math.max(96, (90 - lv * 9) * 3.2);
      if (e.shootTimer >= sniperRate) {
        e.shootTimer = 0;
        if (e.y + e.h >= canvas.height * 0.8 && Math.random() > 0.2) { /* 하단 20% 구역: 20% 확률로만 발사 */ } else {
        const dx = player.x+player.w/2 - (e.x+e.w/2);
        const dy = player.y+player.h/2 - (e.y+e.h/2);
        const dist = Math.hypot(dx, dy) || 1;
        const spd = (5 + lv * 0.5) * 0.25;
        // 레벨 높으면 3방향 조준탄
        const angles = lv >= 7 ? [-0.15, 0, 0.15] : [0];
        for (const da of angles) {
          const angle = Math.atan2(dy, dx) + da;
          enemyBullets.push({ x: e.x+e.w/2-4, y: e.y+e.h/2, w: 7, h: 7,
            vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, dmg: 10 + lv * 2, color: '#ff4' });
        }
        }
      }

    } else if (e.type === 'shooter') {
      e.y += e.speed * 0.5;
      e.x += Math.sin(state.frame * 0.03 + e.sinOffset) * 1.5;
      e.shootTimer++;
      // 레벨 2~3: 느린 발사, 레벨 높을수록 점점 빨라짐
      const shootRate = Math.max(60, 200 - lv * 14);
      if (e.shootTimer >= shootRate) {
        e.shootTimer = 0;
        if (e.y + e.h >= canvas.height * 0.8 && Math.random() > 0.2) { /* 하단 20% 구역: 20% 확률로만 발사 */ } else {
        const dx = player.x+player.w/2 - (e.x+e.w/2);
        const dy = player.y+player.h/2 - (e.y+e.h/2);
        const dist = Math.hypot(dx, dy) || 1;
        const spd = 3.5 + lv * 0.3;
        // 레벨 5부터 2방향 동시 발사
        if (lv >= 5) {
          for (const da of [-0.2, 0.2]) {
            const angle = Math.atan2(dy, dx) + da;
            enemyBullets.push({ x: e.x+e.w/2-4, y: e.y+e.h/2, w: 8, h: 8,
              vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, dmg: 8 + lv });
          }
        } else {
          enemyBullets.push({ x: e.x+e.w/2-4, y: e.y+e.h/2, w: 8, h: 8,
            vx: (dx/dist)*spd, vy: (dy/dist)*spd, dmg: 8 + lv });
        }
        }
      }

    } else if (e.type === 'fast') {
      e.y += e.speed;
      e.x += Math.sin(state.frame * 0.05 + e.sinOffset) * (2.5 + lv * 0.2);

    } else if (e.type === 'ghost') {
      // 수직 낙하
      e.y += e.speed;
      e.x += Math.sin(state.frame * 0.025 + e.sinOffset) * 1.0;

      // 사격: 항상 발사 (투명 구간 포함)
      e.shootTimer++;
      const ghostRate = Math.max(40, 100 - lv * 3);
      if (e.shootTimer >= ghostRate) {
        e.shootTimer = 0;
        const dx = player.x+player.w/2 - (e.x+e.w/2);
        const dy = player.y+player.h/2 - (e.y+e.h/2);
        const dist = Math.hypot(dx, dy) || 1;
        const spd = (3.5 + lv * 0.15) / 3;
        // 3방향 조준탄
        for (const da of [-0.18, 0, 0.18]) {
          const angle = Math.atan2(dy, dx) + da;
          enemyBullets.push({ x: e.x+e.w/2-4, y: e.y+e.h/2, w: 8, h: 8,
            vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, dmg: 10 + lv, color: '#00ffcc' });
        }
      }

    } else {
      // basic
      e.y += e.speed;
      e.x += Math.sin(state.frame * 0.02 + e.sinOffset) * 1;
    }

    // ghost: 화면 상단 25% 위에서는 미사일에 무적 (투명 상태)
    // 25% 아래로 내려오면 모습이 드러나며 미사일에 맞음
    const ghostRevealY = canvas.height * 0.25;
    const isGhostInvisible = (e.type === 'ghost' && e.y < ghostRevealY);

    // Bullet collision
    for (let b of bullets) {
      if (isGhostInvisible) {
        // 투명 상태: 미사일 통과 (데미지 없음, 미사일은 계속 날아감)
        continue;
      }
      if (b.x < e.x+e.w && b.x+b.w > e.x && b.y < e.y+e.h && b.y+b.h > e.y) {
        e.hp -= (b.dmg || 1);
        b.life = (b.life === undefined ? 1 : b.life) - 1;
        spawnParticles(b.x, b.y, b.color || '#0af', 5);
      }
    }

    if (e.hp <= 0) {
      state.score += e.score;
      const deathColor = e.type === 'boss' ? '#f80' : e.type === 'sniper' ? '#ff4' : e.type === 'ghost' ? '#00ffcc' : '#f06';
      spawnParticles(e.x+e.w/2, e.y+e.h/2, deathColor, e.type === 'boss' ? 50 : e.type === 'ghost' ? 25 : 15);
      spawnPowerup(e.x+e.w/2, e.y+e.h/2);
      e.dead = true;
    }

    // Enemy collides with player
    if (player.invincible <= 0 && e.x < player.x+player.w && e.x+e.w > player.x && e.y < player.y+player.h && e.y+e.h > player.y) {
      state.hp -= 20;
      player.invincible = 90;
      spawnParticles(player.x+player.w/2, player.y+player.h/2, '#f00', 20);
      e.dead = true;
    }
  }
  enemies = enemies.filter(e => !e.dead && e.y < canvas.height + 100);
  // 일반 적 상한 80개 (보스 제외)
  const bossTypes = ['boss'];
  const nonBoss = enemies.filter(e => !bossTypes.includes(e.type));
  const bossOnly = enemies.filter(e => bossTypes.includes(e.type));
  if (nonBoss.length > 80) nonBoss.splice(0, nonBoss.length - 80);
  enemies = [...bossOnly, ...nonBoss];
}

// ─── PATRIOT MISSILE SYSTEM ───
let patriotTimer = 0;
const PATRIOT_INTERVAL = 18;  // 18프레임마다 1발 (유도탄)
const PATRIOT_SPEED    = 9;   // 유도탄 속도
const PATRIOT_KILL_R   = 38;  // 근접 폭발 범위(px)

// 직선 페트리어트 (레벨8+)
let straightPatriots = [];
let straightPatriotTimer = 0;

function getStraightPatriotCount() {
  const lv = state.level;
  if (lv >= 14) return 7;
  if (lv >= 12) return 6;
  if (lv >= 11) return 5;
  if (lv >= 10) return 4;
  if (lv >= 9)  return 3;
  if (lv >= 8)  return 2;
  return 0;
}

function getStraightPatriotInterval() {
  return Math.max(10, 28 - (state.level - 8) * 2);
}

function fireStraightPatriots() {
  const count = getStraightPatriotCount();
  if (count <= 0) return;
  const px = player.x + player.w / 2;
  const py = player.y;
  const spd = 18;
  const totalSpread = (count - 1) * 10;
  for (let i = 0; i < count; i++) {
    const spread = (i - (count - 1) / 2) * 10;
    straightPatriots.push({
      x: px + spread, y: py,
      vx: 0,
      vy: -spd,
      dead: false,
    });
  }
}

function updatePatriots() {
  if (gunLevel < 5) { patriots = []; return; }

  // ── 유도 페트리어트 ──
  patriotTimer++;
  if (patriotTimer >= PATRIOT_INTERVAL && enemyBullets.length > 0) {
    patriotTimer = 0;
    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    let nearest = null, nearestDist = Infinity;
    for (const b of enemyBullets) {
      if (b.immune) continue; // 무적 탄은 타깃 제외
      const d = Math.hypot(b.x - px, b.y - py);
      if (d < nearestDist) { nearestDist = d; nearest = b; }
    }
    if (nearest) {
      patriots.push({
        x: px, y: py,
        targetId: nearest,
        vx: 0, vy: -PATRIOT_SPEED,
        dead: false,
      });
    }
  }

  for (const p of patriots) {
    if (p.dead) continue;
    if (p.targetId && !p.targetId.dead && enemyBullets.includes(p.targetId)) {
      const tx = p.targetId.x + (p.targetId.w || 8) / 2;
      const ty = p.targetId.y + (p.targetId.h || 8) / 2;
      const dx = tx - p.x, dy = ty - p.y;
      const dist = Math.hypot(dx, dy) || 1;
      const desiredVx = (dx / dist) * PATRIOT_SPEED;
      const desiredVy = (dy / dist) * PATRIOT_SPEED;
      p.vx += (desiredVx - p.vx) * 0.22;
      p.vy += (desiredVy - p.vy) * 0.22;
      if (dist < 12) { explodePatriot(p); continue; }
    } else {
      let nearest = null, nearestDist = Infinity;
      for (const b of enemyBullets) {
        if (b.immune) continue; // 무적 탄은 타깃 제외
        const d = Math.hypot(b.x - p.x, b.y - p.y);
        if (d < nearestDist) { nearestDist = d; nearest = b; }
      }
      if (nearest) { p.targetId = nearest; }
      else { p.vy = -PATRIOT_SPEED; }
    }
    p.x += p.vx;
    p.y += p.vy;
    if (p.y < -30 || p.y > canvas.height + 30 || p.x < -30 || p.x > canvas.width + 30) {
      p.dead = true;
    }
  }
  patriots = patriots.filter(p => !p.dead);

  // ── 직선 페트리어트 (레벨8+) ──
  if (state.level >= 8) {
    straightPatriotTimer++;
    if (straightPatriotTimer >= getStraightPatriotInterval()) {
      straightPatriotTimer = 0;
      fireStraightPatriots();
    }
    for (const sp of straightPatriots) {
      if (sp.dead) continue;
      sp.x += sp.vx;
      sp.y += sp.vy;
      // 적 미사일 요격
      for (const b of enemyBullets) {
        if (b.dead) continue;
        const d = Math.hypot(b.x + (b.w||8)/2 - sp.x, b.y + (b.h||8)/2 - sp.y);
        if (d < 18) {
          b.dead = true;
          sp.dead = true;
          if (Math.random() < 0.5) spawnParticles(sp.x, sp.y, '#ff3300', 4);
          if (Math.random() < 0.5) spawnParticles(b.x, b.y, '#ff4400', 3);
          break;
        }
      }
      // 적 기체에도 데미지
      if (!sp.dead) {
        for (const e of enemies) {
          if (sp.x > e.x && sp.x < e.x + e.w && sp.y > e.y && sp.y < e.y + e.h) {
            e.hp -= getBulletDmg();
            sp.dead = true;
            spawnParticles(sp.x, sp.y, '#ff6600', 5);
            break;
          }
        }
      }
      if (sp.y < -40 || sp.y > canvas.height + 40 || sp.x < -40 || sp.x > canvas.width + 40) {
        sp.dead = true;
      }
    }
    straightPatriots = straightPatriots.filter(sp => !sp.dead);
  } else {
    straightPatriots = [];
  }
}

function explodePatriot(p) {
  p.dead = true;
  if (Math.random() < 0.5) spawnParticles(p.x, p.y, '#ff3300', 6);
  // 근접 범위 내 적 미사일 제거 (immune 탄은 제외)
  for (const b of enemyBullets) {
    if (b.immune) continue; // 핑크보스 유도탄은 페트리어트 무적
    const d = Math.hypot(b.x - p.x, b.y - p.y);
    if (d < PATRIOT_KILL_R) {
      b.dead = true;
      if (Math.random() < 0.5) spawnParticles(b.x, b.y, '#ff4400', 2);
    }
  }
}

function drawPatriots() {
  // ── 유도 페트리어트 (청록색) ──
  for (const p of patriots) {
    const angle = Math.atan2(p.vy, p.vx) + Math.PI / 2;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#0ff';
    ctx.fillStyle = '#0ff';
    ctx.fillRect(-2, -8, 4, 12);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-1, 4, 2, 4);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ── 직선 페트리어트 (주황/노랑 - 기존과 다른 색상) ──
  for (const sp of straightPatriots) {
    const angle = Math.atan2(sp.vy, sp.vx) + Math.PI / 2;
    ctx.save();
    ctx.translate(sp.x, sp.y);
    ctx.rotate(angle);
    // 몸통 (노랑)
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#ffaa00';
    ctx.fillStyle = '#ffdd00';
    ctx.fillRect(-2, -10, 4, 14);
    // 헤드 (주황 삼각형)
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(-4, -8);
    ctx.lineTo(4, -8);
    ctx.closePath();
    ctx.fill();
    // 꼬리 불꽃 (빨강)
    ctx.fillStyle = '#ff3300';
    ctx.shadowColor = '#ff6600';
    ctx.shadowBlur = 8;
    ctx.fillRect(-1.5, 4, 3, 5);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}

// ─── UPDATE POWERUPS ───
function updatePowerups() {
  for (let p of powerups) {
    p.y += p.vy;
    p.timer++;
    if (p.x < player.x+player.w && p.x+30 > player.x && p.y < player.y+player.h && p.y+30 > player.y) {
      if (p.type === 'heal') {
        state.hp = Math.min(state.hp + 25, state.maxHp);
        spawnParticles(p.x+15, p.y+15, '#0f8', 15);
      } else if (p.type === 'gun') {
        gunLevel = Math.max(gunLevel + 1, gunLevel); // 절대 감소하지 않음
        spawnParticles(p.x+15, p.y+15, '#ff0', 20);
        showGunLevelMsg();
      } else if (p.type === 'bomb') {
        bombCount = Math.min(bombCount + 1, 5);
        spawnParticles(p.x+15, p.y+15, '#f80', 20);
        updateBombUI();
      }
      p.dead = true;
    }
  }
  powerups = powerups.filter(p => !p.dead && p.y < canvas.height + 50 && p.timer < 500);
}

// ─── DRAW POWERUPS ───
function drawPowerups() {
  for (let p of powerups) {
    const pulse = 0.7 + 0.3 * Math.sin(p.timer * 0.1);
    ctx.globalAlpha = pulse;
    ctx.font = '22px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.icon, p.x + 15, p.y + 15);

    // Glow ring
    ctx.globalAlpha = 0.4 * pulse;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x + 15, p.y + 15, 18 + Math.sin(p.timer * 0.1) * 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

// ─── UPDATE PARTICLES ───
function updateParticles() {
  for (let p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= 0.03;
    p.size *= 0.96;
  }
  particles = particles.filter(p => p.life > 0 && p.size > 0.3);
}

function drawParticles() {
  // 파티클 상한 300개 (오래된 것부터 제거)
  if (particles.length > 300) particles.splice(0, particles.length - 300);
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    // shadowBlur 제거 → 파티클은 색상만으로 표현 (렌더링 부하 최대 절감)
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function triggerLightning() {
  lightnings = [];
  for (let i = 0; i < 28; i++) {
    lightnings.push({
      life: 1.0,
      segs: generateLightningSeg(
        Math.random() * canvas.width,
        0,
        Math.random() * canvas.width,
        canvas.height
      ),
      color: Math.random() < 0.5 ? '#fff' : (Math.random() < 0.5 ? '#ff0' : '#0af'),
      width: Math.random() * 2.5 + 0.8,
    });
  }
}

function generateLightningSeg(x1, y1, x2, y2) {
  const pts = [{x: x1, y: y1}];
  const steps = 12;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    pts.push({
      x: x1 + (x2 - x1) * t + (Math.random() - 0.5) * 120,
      y: y1 + (y2 - y1) * t + (Math.random() - 0.5) * 40,
    });
  }
  pts.push({x: x2, y: y2});
  return pts;
}

function updateAndDrawLightnings() {
  if (lightnings.length === 0) return;
  for (let lg of lightnings) {
    lg.life -= 0.055;
    ctx.globalAlpha = Math.max(0, lg.life);
    ctx.strokeStyle = lg.color;
    ctx.lineWidth = lg.width;
    ctx.shadowColor = lg.color;
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(lg.segs[0].x, lg.segs[0].y);
    for (let i = 1; i < lg.segs.length; i++) ctx.lineTo(lg.segs[i].x, lg.segs[i].y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  lightnings = lightnings.filter(lg => lg.life > 0);
}

let levelMsg = null, levelMsgTimer = 0;
function checkLevel() {
  // 메가보스 전투 중엔 레벨업 체크 건너뜀 (16 이후는 허용)
  if (megaBossActive) return;
  // 레벨20은 수직운석 2회 완료 후 수동으로 21이 됨 — 점수 기반 자동 넘김 방지
  if (state.level >= 20 && state.level < 21) return;
  // 레벨21→22: 점수 기반 (27000 + 11*15000 = 192000점)
  if (state.level === 21) {
    const needed = 7000; // 진입 후 7,000점 획득 시 전환
    if ((state.score - level21EntryScore) >= needed && !pinkBossActive && !pinkBossDefeated) {
      state.level = 22;
      document.getElementById('levelDisplay').textContent = '22';
      enemies = []; enemyBullets = [];
      setTimeout(() => spawnPinkBoss(), 5000);
      const el2 = document.getElementById('levelUpMsg');
      const sub2 = document.getElementById('luSubText');
      sub2.style.color = '#ff88cc';
      sub2.style.textShadow = '0 0 24px #ff44aa, 0 0 50px #ff0088';
      sub2.textContent = '💗 PINK BOSS 출현! ';
      el2.classList.add('show');
      setTimeout(() => {
        el2.classList.remove('show');
        sub2.style.color = '#fc0';
        sub2.style.textShadow = '0 0 20px #fc0, 0 0 40px #f80';
      }, 3000);
    }
    return;
  }
  if (state.level >= 22) return;

  // 레벨 10까지는 고정 임계값, 이후는 스코어 기반으로 계속 올라감
  const thresholds = [0,300,750,1500,2700,4500,7500,10000,18000,27000];
  let newLevel = thresholds.filter(t => state.score >= t).length;
  // 레벨 10 이후: 매 15000점마다 레벨 1씩 추가
  if (newLevel >= 10) {
    const extraScore = state.score - 27000;
    if (extraScore > 0) newLevel = 10 + Math.floor(extraScore / 15000);
  }
  // 레벨14 이상은 메가보스 격파 후에만 15로 넘어감
  if (newLevel >= 14 && !megaBossDefeated) {
    newLevel = 14;
  }
  if (newLevel > state.level) {
    state.level = newLevel;
    showLevelUp();
  }
}

        sub.style.textShadow = '0 0 20px #fc0, 0 0 40px #f80';

}
